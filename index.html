/* ── ZIRME Main ───────────────────────────────────────────────────────── */
function ZIRME() {
  const [files,    setFiles]   = useState([]);
  const [selId,    setSelId]   = useState(null);
  const [multiSel, setMultiSel]= useState(new Set());
  const [editId,   setEditId]  = useState(null);
  const [previewId,setPreviewId]=useState(null);
  const [settings, setSettings]= useState(()=>{
    let fmt="png"; try{fmt=localStorage.getItem("zirme-fmt")||"png";}catch(e){}
    return {w:1024, h:1024, lockAspect:true, sizeMode:"fixed", focalAuto:true, focalPoint:{ax:0.5,ay:0.5}, 
            detectionMode:"auto", // "auto" | "manual" | "face" | "body"
            adjustToTargetSize:true, // Si true, respeta el tamaño objetivo en detección ML
            poseNetEnabled:false, // V11.1: PoseNet refinamiento (solo para modo body)
            fmt, quality:92, prefix:"", suffix:"",
            renameMode:"keep", renameBase:"image", renameNum:true, renameStart:1,
            borderW:0, borderColor:"#000000",
            wmEnabled:false, wmText:"", wmFont:"Inter", wmSize:24, wmColor:"#ffffff", wmOpacity:80, wmPos:"br"};
  });
  const [mlReady, setMlReady] = useState({face:false, body:false, warned:false});
  const [mlWarningDialog, setMlWarningDialog] = useState({show:false, mode:null});
  const [mlDontShowAgain, setMlDontShowAgain] = useState(()=>{
    try{ return localStorage.getItem("zirme-ml-dont-warn")==="true"; }catch(e){ return false; }
  });
  const [showAnnouncement, setShowAnnouncement] = useState(()=>{
    if(!ANNOUNCEMENT.enabled) return false;
    try{ return !localStorage.getItem("zirme-ann-"+ANNOUNCEMENT.id); }catch(e){ return false; }
  });
  const dismissAnnouncement = useCallback(()=>{
    try{ localStorage.setItem("zirme-ann-"+ANNOUNCEMENT.id,"1"); }catch(e){}
    setShowAnnouncement(false);
  },[]);
  // Display values for dimension inputs (decoupled from settings to allow free editing)
  const [wInput, setWInput] = useState(String(settings.w));
  const [hInput, setHInput] = useState(String(settings.h));
  const dimEditingRef = useRef(null); // "w" | "h" | null — which field is focused
  // Sync display when settings.w/h change from other sources (e.g. aspect ratio lock)
  useEffect(()=>{ if(dimEditingRef.current!=="w") setWInput(String(settings.w)); },[settings.w]);
  useEffect(()=>{ if(dimEditingRef.current!=="h") setHInput(String(settings.h)); },[settings.h]);

  const [blurCfg,  setBlurCfg] = useState({size:60,strength:12,hardness:30,opacity:85,pixelSize:8});
  const [zipping,  setZipping] = useState(false);
  const [zipPct,   setZipPct]  = useState(0);
  const [smartBatch,setSmartBatch]=useState({running:false,done:0,total:0}); // smart crop batch progress
  const [tick,     setTick]    = useState(0);
  const [cellH,    setCellH]   = useState(380);
  const [panelOpen,setPanelOpen]= useState(true);
  const [panelTab,  setPanelTab]  = useState("image");

  const [helpOpen, setHelpOpen] = useState(false);
  const [helpTab,  setHelpTab]  = useState(null);
  const [langOpen, setLangOpen] = useState(false);
  const helpRef = useRef(null);
  const [lang,     setLang]    = useState(()=>{try{return localStorage.getItem("zirme-lang")||"en";}catch(e){return "en";}});
  const langNames = {en:"English",es:"Español",fr:"Français",de:"Deutsch",pt:"Português",it:"Italiano",zh:"中文",ja:"日本語",ru:"Русский"};
  const langRef = useRef(null);

  const t = STRINGS[lang]||STRINGS.en;

  useEffect(()=>{
    const h=(e)=>{
      if(langRef.current&&!langRef.current.contains(e.target)) setLangOpen(false);
      if(helpRef.current&&!helpRef.current.contains(e.target)) setHelpOpen(false);
    };
    document.addEventListener("mousedown",h); return()=>document.removeEventListener("mousedown",h);
  },[]);
  useEffect(()=>{try{localStorage.setItem("zirme-lang",lang);}catch(e){}
    const ov=document.getElementById("drop-overlay");
    if(ov){ov.querySelector(".label").textContent=t.dropLabel;ov.querySelector(".sub").textContent=t.dropFormats;}
  },[lang,t]);
  useEffect(()=>{try{localStorage.setItem("zirme-fmt",settings.fmt);}catch(e){};},[settings.fmt]);

  const filesRef    = useRef([]);
  const settingsRef = useRef(settings);
  const editIdRef   = useRef(editId);
  const selIdRef    = useRef(selId);
  const multiSelRef = useRef(multiSel);
  useEffect(()=>{filesRef.current=files;},[files]);
  useEffect(()=>{settingsRef.current=settings;},[settings]);
  useEffect(()=>{editIdRef.current=editId;},[editId]);
  useEffect(()=>{selIdRef.current=selId;},[selId]);
  useEffect(()=>{multiSelRef.current=multiSel;},[multiSel]);

  const sel      = files.find(f=>f.id===selId)??null;
  const editFile = files.find(f=>f.id===editId)??null;
  const previewFile = files.find(f=>f.id===previewId)??null;
  // V11.3: Usar editFile si está en modo edición, sino sel
  const activeFile = editFile || sel;
  const canUndo  = (activeFile?.history||[]).length>0;
  const canRedo  = (activeFile?.future||[]).length>0;

  // Global keyboard shortcuts — patrón ref: listener registrado una sola vez
  const kbHandlerRef = useRef(null);
  kbHandlerRef.current = (e)=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();undoSel();}
    if((e.ctrlKey||e.metaKey)&&e.key==="y"){e.preventDefault();redoSel();}
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      e.preventDefault();
      setSelId(prev=>{
        const idx=filesRef.current.findIndex(f=>f.id===prev);
        if(idx<0) return filesRef.current[0]?.id??null;
        const next=e.key==="ArrowRight"?Math.min(idx+1,filesRef.current.length-1):Math.max(idx-1,0);
        return filesRef.current[next]?.id??prev;
      });
    }
  };
  useEffect(()=>{
    const h=(e)=>kbHandlerRef.current(e);
    window.addEventListener("keydown",h); return()=>window.removeEventListener("keydown",h);
  },[]);  // sin deps: solo se registra/cancela al mount/unmount

  useEffect(()=>{ const h=()=>setTick(n=>n+1); window.addEventListener("resize",h); return()=>window.removeEventListener("resize",h); },[]);

  const pushUndo = useCallback((id)=>{
    setFiles(prev=>prev.map(f=>{
      if(f.id!==id) return f;
      const entry={snap:snapCanvas(f.ec),crop:f.crop};
      return {...f,history:[...(f.history||[]),entry].slice(-30),future:[]};
    }));
  },[]);

  const undoSel = useCallback(()=>{
    // V11.5: usar refs → sin dependencias de selId/editId
    const targetId = editIdRef.current || selIdRef.current;
    if(!targetId) return;

    setFiles(prev=>prev.map(f=>{
      if(f.id!==targetId) return f;
      const hist=f.history||[]; if(!hist.length){showToast(t.toastNoUndo);return f;}
      const last=hist[hist.length-1];
      const futureEntry={snap:snapCanvas(f.ec),crop:f.crop};
      f.ec.getContext("2d").clearRect(0,0,f.ec.width,f.ec.height);
      f.ec.getContext("2d").drawImage(last.snap,0,0);
      setTick(n=>n+1);
      return{...f,history:hist.slice(0,-1),future:[futureEntry,...(f.future||[])].slice(0,30),crop:last.crop};
    }));
  },[t]);

  const redoSel = useCallback(()=>{
    // V11.5: usar refs → sin dependencias de selId/editId
    const targetId = editIdRef.current || selIdRef.current;
    if(!targetId) return;
    
    setFiles(prev=>prev.map(f=>{
      if(f.id!==targetId) return f;
      const fut=f.future||[]; if(!fut.length){showToast(t.toastNoRedo);return f;}
      const next=fut[0];
      const histEntry={snap:snapCanvas(f.ec),crop:f.crop};
      f.ec.getContext("2d").clearRect(0,0,f.ec.width,f.ec.height);
      f.ec.getContext("2d").drawImage(next.snap,0,0);
      setTick(n=>n+1);
      return{...f,future:fut.slice(1),history:[...(f.history||[]),histEntry].slice(-30),crop:next.crop};
    }));
  },[t]);

  const setCropForId = useCallback((id,crop)=>{
    // When called from user interaction (drag/edit), mark as manual by removing auto flag
    const manualCrop = crop ? {...crop, auto:false} : null;
    setFiles(prev=>prev.map(f=>f.id===id?{...f,crop:manualCrop}:f));
  },[]);

  const removeFile = useCallback((id)=>{
    setFiles(prev=>{const n=prev.filter(f=>f.id!==id); if(selId===id)setSelId(n[0]?.id??null); return n;});
    if(editId===id) setEditId(null);
    setMultiSel(s=>{const ns=new Set(s);ns.delete(id);return ns;});
  },[selId,editId]);

  const handleSelect = useCallback((id, shift)=>{
    if(shift){
      // V11.5: Al entrar en multi-sel, mover selId actual a multiSel
      setMultiSel(s=>{
        const ns=new Set(s);
        const prev=selIdRef.current;
        if(prev) ns.add(prev);            // incluir selección principal
        ns.has(id)?ns.delete(id):ns.add(id); // toggle el nuevo
        return ns;
      });
      setSelId(null);                       // multiSel es la fuente de verdad
    } else {
      setSelId(id); setMultiSel(new Set());
    }
  },[]);

  const reorderFiles = useCallback((srcId,dstId)=>{
    setFiles(prev=>{
      const arr=[...prev];
      const si=arr.findIndex(f=>f.id===srcId);
      const di=arr.findIndex(f=>f.id===dstId);
      if(si<0||di<0) return prev;
      const [item]=arr.splice(si,1); arr.splice(di,0,item);
      return arr;
    });
  },[]);

  const loadFiles = useCallback((fs)=>{
    Array.from(fs).forEach(file=>{
      if(!file.type.startsWith("image/")) return;
      const id=`i${++_uid}`;
      const img=new Image();
      img.onload=async()=>{
        const ec=document.createElement("canvas"); ec.width=img.naturalWidth; ec.height=img.naturalHeight;
        ec.getContext("2d").drawImage(img,0,0);
        // Auto-crop on load — same logic as applyFocalAll, marked auto:true
        const {w:oW,h:oH,focalAuto,focalPoint}=settingsRef.current;
        let crop=null;
        if(focalAuto){
          const nc=await runSmartCrop(ec,oW,oH);
          crop=nc&&nc.w>2?{...nc,auto:true}:null;
        }
        if(!crop){
          const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
          crop={...focalCrop(ec.width,ec.height,oW,oH,ax,ay),auto:true};
        }
        setFiles(prev=>[...prev,{id,file,name:file.name,orig:img,ec,thumb:img.src,crop,history:[],future:[]}]);
        setTick(n=>n+1); // No auto-select on load
      };
      img.src=URL.createObjectURL(file);
    });
  },[]);
  useEffect(()=>{window._zirmeDrop=loadFiles;},[loadFiles]);

  // Re-apply auto crop when output size or focal settings change
  // — in edit mode: only recalculates the current image
  // — in gallery mode: recalculates all auto-flagged images
  useEffect(()=>{
    const{w:oW,h:oH,focalAuto,focalPoint}=settings;
    const currentEditId=editIdRef.current;
    if(currentEditId){
      // Edit mode: apply only to this image, mark as auto:false (user triggered via panel)
      applySingleFocal(currentEditId);
      return;
    }
    // Gallery mode: batch recalc for auto-flagged images
    // SOLO procesar si focalAuto está ON (Auto/Rostro/Cuerpo)
    // Manual NO auto-procesa - el usuario controla con applyFocalAll()
    if(!focalAuto) return;
    
    const autoFiles=filesRef.current.filter(f=>f.crop?.auto!==false);
    if(!autoFiles.length) return;
    
    // OPTIMIZACIÓN: Procesar en lotes
    (async()=>{
      const BATCH_SIZE = 10;
      const batches = [];
      for(let i = 0; i < autoFiles.length; i += BATCH_SIZE) {
        batches.push(autoFiles.slice(i, i + BATCH_SIZE));
      }
      
      for(const batch of batches) {
        const results = await Promise.all(
          batch.map(async f => {
            const nc = await runSmartCrop(f.ec, oW, oH);
            const crop = nc&&nc.w>2 ? {...nc,auto:true} : {...focalCrop(f.ec.width,f.ec.height,oW,oH,0.5,0.5),auto:true};
            return { id: f.id, crop };
          })
        );
        
        // Un solo setState por lote
        setFiles(prev => prev.map(ff => {
          const result = results.find(r => r.id === ff.id);
          return result && ff.crop?.auto!==false ? {...ff, crop: result.crop} : ff;
        }));
      }
    })();
  },[settings.w,settings.h,settings.focalPoint]);

  // Unified focal-point crop — uses smartcrop when focalAuto is ON, anchor-based otherwise.
  // Processes sequentially to avoid memory pressure on large galleries.
  const applyFocalAll = useCallback(async()=>{
    const{w:oW,h:oH,focalAuto,focalPoint,detectionMode,adjustToTargetSize,poseNetEnabled}=settingsRef.current;
    
    // V11.3 CRÍTICO: Si modo edición activo, aplicar SOLO a imagen en edición
    const currentEditId = editIdRef.current;
    if(currentEditId) {
      // MODO EDICIÓN: Solo procesar imagen activa
      const f = filesRef.current.find(ff => ff.id === currentEditId);
      if(!f) return;
      
      setSmartBatch({running:true,done:0,total:1});
      
      let nc = null;
      if(detectionMode === "face"){
        nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
      } else if(detectionMode === "body"){
        nc = await detectBodyCrop(f.ec, oW, oH, adjustToTargetSize, poseNetEnabled);
      } else if(focalAuto && detectionMode === "auto"){
        nc = await runSmartCrop(f.ec, oW, oH);
      }
      
      if(!nc||nc.w<2||nc.h<2){
        const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
        nc=focalCrop(f.ec.width,f.ec.height,oW,oH,ax,ay);
      }
      
      setFiles(prev => prev.map(ff => ff.id === currentEditId ? {...ff, crop: {...nc, auto:true}} : ff));
      setSmartBatch({running:false,done:0,total:0});
      showToast(t.toastSmartAppliedEditing);
      return;
    }
    
    // MODO NORMAL: Leer de refs para obtener valores actuales
    const currentSelId = selIdRef.current;
    const currentMultiSel = multiSelRef.current;
    
    // Determinar qué imágenes procesar según la selección
    let targets;
    if(currentSelId && currentMultiSel.size===0) {
      // Una sola imagen seleccionada → solo esa
      targets = [currentSelId];
    } else if(currentMultiSel.size > 0) {
      // Multi-selección → solo las seleccionadas
      targets = [...currentMultiSel];
    } else {
      // Sin selección → todas
      targets = filesRef.current.map(f=>f.id);
    }
    
    const total=targets.length; if(!total) return;
    setSmartBatch({running:true,done:0,total});
    let applied=0;
    
    // OPTIMIZACIÓN: Procesar en lotes de 10 para mejor performance
    const BATCH_SIZE = 10;
    const batches = [];
    for(let i = 0; i < targets.length; i += BATCH_SIZE) {
      batches.push(targets.slice(i, i + BATCH_SIZE));
    }
    
    for(const batch of batches) {
      // Procesar lote en paralelo
      const results = await Promise.all(
        batch.map(async id => {
          const f = filesRef.current.find(ff => ff.id === id);
          if(!f) return null;
          
          let nc = null;
          
          // Usar detección ML según el modo
          if(detectionMode === "face"){
            nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
          } else if(detectionMode === "body"){
            nc = await detectBodyCrop(f.ec, oW, oH, adjustToTargetSize, poseNetEnabled);
          } else if(focalAuto && detectionMode === "auto"){
            nc = await runSmartCrop(f.ec, oW, oH);
          }
          
          if(!nc||nc.w<2||nc.h<2){
            // Anchor fallback (or primary when focalAuto is off)
            const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
            nc=focalCrop(f.ec.width,f.ec.height,oW,oH,ax,ay);
          }
          
          return { id, crop: {...nc, auto:true} };
        })
      );
      
      // Un solo setState por lote (en lugar de uno por imagen)
      const validResults = results.filter(r => r !== null);
      if(validResults.length > 0) {
        setFiles(prev => prev.map(ff => {
          const result = validResults.find(r => r.id === ff.id);
          return result ? {...ff, crop: result.crop} : ff;
        }));
      }
      
      applied += validResults.length;
      setSmartBatch(s => ({...s, done: s.done + validResults.length}));
    }
    
    setSmartBatch({running:false,done:0,total:0});
    const modeLabel = detectionMode==="face"?t.detFaces:detectionMode==="body"?t.detBodies:"";
    const countMsg = total===1 ? t.toastProcessed1 : t.toastCroppedN(applied);
    showToast(modeLabel ? `✦ ${countMsg} (${modeLabel})` : `✦ ${countMsg}`);
  },[t,lang]);

  // Single-image focal crop — used when panel scope is "single" (editing mode)
  const applySingleFocal = useCallback(async(fileId)=>{
    const f=filesRef.current.find(ff=>ff.id===fileId);
    if(!f) return;
    const{w:oW,h:oH,focalAuto,focalPoint,detectionMode,adjustToTargetSize,poseNetEnabled}=settingsRef.current;
    let nc=null;
    
    // Usar detección ML según el modo
    if(detectionMode === "face"){
      nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
    } else if(detectionMode === "body"){

    } else if(focalAuto && detectionMode === "auto"){

    }
    
    if(!nc||nc.w<2){
      const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};

  // Rotación y volteo de imágenes
  const rotateImages = useCallback((angle)=>{
    // Leer de refs para obtener valores actuales
    const currentSelId = selIdRef.current;
    const currentMultiSel = multiSelRef.current;
    
    // Determinar qué imágenes rotar según la selección
    let targets;
    if(currentSelId && currentMultiSel.size===0) {
      // Una sola imagen seleccionada → solo esa
      targets = [currentSelId];
    } else if(currentMultiSel.size > 0) {
      // Multi-selección → solo las seleccionadas
      targets = [...currentMultiSel];
    } else {
      // Sin selección → todas
      targets = filesRef.current.map(f=>f.id);
    }
    
    if(!targets.length) return;
    
    let rotated = 0;
    setFiles(prev=>prev.map(f=>{
      if(!targets.includes(f.id)) return f;
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = f.ec;
      
      if(angle === 90 || angle === 270){
        canvas.width = img.height;
        canvas.height = img.width;
      } else {
        canvas.width = img.width;
        canvas.height = img.height;
      }
      
      ctx.save();
      if(angle === 90){
        ctx.translate(canvas.width, 0);
        ctx.rotate(Math.PI / 2);
      } else if(angle === 180){
        ctx.translate(canvas.width, canvas.height);
        ctx.rotate(Math.PI);
      } else if(angle === 270){
        ctx.translate(0, canvas.height);
        ctx.rotate(-Math.PI / 2);
      }
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      
      rotated++;
      
      // Resetear crop al rotar
      const{w:oW,h:oH,focalPoint}=settingsRef.current;
      const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
      const newCrop = focalCrop(canvas.width,canvas.height,oW,oH,ax,ay);
      
      return {...f, ec: canvas, crop: {...newCrop, auto:true}};
    }));

  const flipImages = useCallback((direction)=>{
    // Leer de refs para obtener valores actuales
    const currentSelId = selIdRef.current;
    const currentMultiSel = multiSelRef.current;

    } else if(currentMultiSel.size > 0) {

    if(!targets.length) return;
    
    let flipped = 0;
    setFiles(prev=>prev.map(f=>{

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = f.ec;
      
      canvas.width = img.width;
      canvas.height = img.height;
      
      ctx.save();
      if(direction === 'horizontal'){
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(0, canvas.height);
        ctx.scale(1, -1);
      }
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      
      flipped++;
      return {...f, ec: canvas};
    }));
    
    const dir = direction==='horizontal'?t.flipHorizontally:t.flipVertically;

  const renderFile = useCallback((f, idx)=>{
    const s=settingsRef.current;
    const{focalPoint,fmt,quality,renameMode,renameBase,renameNum,renameStart,sizeMode,borderW,borderColor,wmEnabled,wmText,wmFont,wmSize,wmColor,wmOpacity,wmPos}=s;
    const src=f.ec;

    // ── Compute output dimensions based on sizeMode ──
    let w=s.w, h=s.h;
    if(sizeMode==="autoW"){
      // fixed height, width auto from source aspect
      let c=f.crop; if(!c||c.w<2){ const{ax,ay}=focalPoint||{ax:0.5,ay:0.5}; c=focalCrop(src.width,src.height,src.width,h,ax,ay); }
      w=Math.round((c.w/c.h)*h);
    } else if(sizeMode==="autoH"){
      // fixed width, height auto from source aspect
      let c=f.crop; if(!c||c.w<2){ const{ax,ay}=focalPoint||{ax:0.5,ay:0.5}; c=focalCrop(src.width,src.height,w,src.height,ax,ay); }
      h=Math.round((c.h/c.w)*w);
    }

    // ── Crop ──
    let c=f.crop;
    if(!c||c.w<2){
      const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
      c=focalCrop(src.width,src.height,w,h,ax,ay);
    }
    const sx=Math.max(0,c.x), sy=Math.max(0,c.y);
    const sw=Math.min(c.w,src.width-sx), sh=Math.min(c.h,src.height-sy);

    // ── Canvas with border ──
    const bw=borderW||0;
    const totalW=w+bw*2, totalH=h+bw*2;
    const out=document.createElement("canvas"); out.width=totalW; out.height=totalH;
    const ctx=out.getContext("2d");

    // Draw border (fills the whole canvas first)
    if(bw>0){ ctx.fillStyle=borderColor||"#000000"; ctx.fillRect(0,0,totalW,totalH); }

    // Draw image area
    ctx.fillStyle="#fff"; ctx.fillRect(bw,bw,w,h);
    const sc=Math.min(w/sw,h/sh), dw=sw*sc, dh=sh*sc;
    ctx.drawImage(src,sx,sy,sw,sh,bw+(w-dw)/2,bw+(h-dh)/2,dw,dh);

    // ── Watermark ──
    if(wmEnabled && wmText && wmText.trim()){
      ctx.save();
      ctx.globalAlpha=(wmOpacity||80)/100;
      ctx.fillStyle=wmColor||"#ffffff";
      ctx.font=`${wmSize||24}px ${wmFont||"Inter"},sans-serif`;
      ctx.textBaseline="middle";
      const tm=ctx.measureText(wmText);
      const pad=Math.max(12,Math.round(totalW*0.02));
      let tx,ty;
      if(wmPos==="tl"){ ctx.textAlign="left"; tx=bw+pad; ty=bw+pad+wmSize/2; }
      else if(wmPos==="tr"){ ctx.textAlign="right"; tx=totalW-bw-pad; ty=bw+pad+wmSize/2; }
      else if(wmPos==="bl"){ ctx.textAlign="left"; tx=bw+pad; ty=totalH-bw-pad-wmSize/2; }
      else if(wmPos==="center"){ ctx.textAlign="center"; tx=totalW/2; ty=totalH/2; }
      else { /* br default */ ctx.textAlign="right"; tx=totalW-bw-pad; ty=totalH-bw-pad-wmSize/2; }
      ctx.fillText(wmText,tx,ty);
      ctx.restore();
    }

    // ── MIME ──
    const mime=fmt==="jpeg"?"image/jpeg":fmt==="png"?"image/png":fmt==="avif"?"image/avif":"image/webp";

    // ── Filename ──
    let filename;
    const origName=f.name.replace(/\.[^.]+$/,"");
    if(renameMode==="keep"){
      filename=(s.prefix||"")+origName+(s.suffix||"");
    } else {
      // Support ORIGINAL-NAME keyword
      let base=renameBase||"image";
      base=base.replace(/ORIGINAL-NAME/g,origName);
      if(renameNum){
        const n=(renameStart+idx).toString().padStart(Math.max(2,renameStart.toString().length),"0");
        filename=base+"_"+n;
      } else {
        filename=base;
      }
    }
    const ext=fmt==="jpeg"?"jpg":fmt;
    return{out,mime,ext,quality,filename,w:totalW,h:totalH};
  },[]);

                      <svg width="14" height="14" viewBox="0 0 24 24" fill="#7c5cff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>

      </header>

      {/* Body */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* Grid */}
        <div style={{flex:1,overflowY:"auto",padding:16,position:"relative"}}
             onClick={(e)=>{
               // Deseleccionar si se hace click en el fondo vacío
               if(e.target === e.currentTarget || e.target.closest('.justified-grid-bg')){
                 setSelId(null);
                 setMultiSel(new Set());
               }
             }}>
          {/* Multi-select hint */}
          {multiSel.size>0&&(
            <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(20,14,40,0.92)",border:"1px solid rgba(124,92,255,0.45)",borderRadius:8,padding:"9px 16px",marginBottom:12,display:"flex",alignItems:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.35)"}}>

              <span style={{flex:1,textAlign:"center",fontSize:12,fontWeight:500,color:"#a78bfa",letterSpacing:0.2}}>
                {t.selectedHint(multiSel.size)}
              </span>
              <button onClick={()=>setMultiSel(new Set())}
                style={{background:"transparent",border:"1px solid rgba(124,92,255,0.35)",borderRadius:5,color:"#a78bfa",cursor:"pointer",fontSize:11,padding:"2px 9px",flexShrink:0,fontFamily:"Inter,sans-serif",transition:"background .12s"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(124,92,255,0.18)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                ✕
              </button>
            </div>
          )}
          {files.length===0?(
            <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,color:"#282828"}}>
              <div style={{fontSize:64}}>🖼</div>
              <div style={{fontSize:16,fontWeight:500}}>{t.emptyHint}</div>
              <div style={{fontSize:12}}>{t.emptySub}</div>
            </div>
          ):(
            <JustifiedGrid
              files={files} cellH={cellH} settings={settings}
              selId={selId} multiSel={multiSel} t={t} tick={tick}
              onSelect={handleSelect} onCropChange={setCropForId}
              onUndoPush={pushUndo} onRemove={removeFile}
              onEdit={setEditId} onPreview={setPreviewId}
              loadFiles={loadFiles} onReorder={reorderFiles}
            />
          )}
        </div>

        {/* Panel toggle button — hidden while editor is active to avoid overlap */}
        {!panelOpen&&!editFile&&(
          <button onClick={()=>setPanelOpen(true)}
            style={{position:"absolute",right:0,top:"50%",transform:"translateY(-50%)",zIndex:50,fontFamily:"Inter",fontSize:11,background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:"6px 0 0 6px",color:"#666",padding:"12px 6px",cursor:"pointer",writingMode:"vertical-lr",letterSpacing:1}}>
            {t.panelShow}
          </button>
        )}

        {/* Right panel */}
        {panelOpen&&(
        <aside style={{width:360,background:"#1e1e1e",borderLeft:"1px solid #242424",overflowY:"auto",padding:"10px 14px",flexShrink:0,display:"flex",flexDirection:"column"}}>

          {/* Panel hide button */}
          <button onClick={()=>setPanelOpen(false)}
            style={{fontFamily:"Inter,sans-serif",fontSize:10,background:"transparent",border:"none",color:"#444",cursor:"pointer",textAlign:"right",padding:"2px 0",marginBottom:4}}>
            {t.panelHide}
          </button>

          {/* Tabs */}
          <div className="tab-bar">
            <button className={"tab-btn "+(panelTab==="image"?"active":"inactive")} onClick={()=>setPanelTab("image")}>{t.tabImage}</button>
            <button className={"tab-btn "+(panelTab==="export"?"active":"inactive")} onClick={()=>setPanelTab("export")}>{t.tabExport}</button>
          </div>

          {/* ─── EDITAR TAB ─── */}
          {panelTab==="image"&&(<>

            {/* VISTA */}
            <div className="sec-block">
              <span className="sec-title">{t.secThumbs}</span>
              <label className="lbl">{t.thumbSize(cellH)}</label>
              <input type="range" min={180} max={700} value={cellH} onChange={e=>setCellH(+e.target.value)} style={{marginBottom:6}}/>
            </div>

            {/* COMPOSICIÓN */}
            <div className="sec-block">
              <span className="sec-title">{t.secComposition}</span>

              {/* Tamaño de salida - botones */}
              <label className="lbl">{t.secOutput}</label>
              <div style={{display:"flex",gap:4,marginBottom:12,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {["fixed","autoW","autoH"].map(m=>(
                  <button key={m} onClick={()=>setSettings(s=>({...s,sizeMode:m}))}
                    style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:settings.sizeMode===m?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                      background:settings.sizeMode===m?"#7c5cff":"transparent",
                      color:settings.sizeMode===m?"#fff":"#555",whiteSpace:"nowrap"}}>
                    {m==="fixed"?t.sizeFixed:m==="autoW"?t.sizeAutoW:t.sizeAutoH}
                  </button>
                ))}
              </div>

              {/* Bloquear proporción - solo en modo fixed */}
              {settings.sizeMode==="fixed"&&<>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <label className="lbl" style={{marginBottom:0}}>{t.lockAspectRatio}</label>
                  <button onClick={()=>setSettings(s=>({...s,lockAspect:!s.lockAspect}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"3px 10px",cursor:"pointer",transition:"all .12s",
                      background:settings.lockAspect?"#7c5cff":"transparent",
                      borderColor:settings.lockAspect?"#7c5cff":"#2e2e2e",
                      color:settings.lockAspect?"#fff":"#555"}}>
                    {settings.lockAspect?"ON":"OFF"}
                  </button>
                </div>
              </>}

              {/* Ancho */}
              {settings.sizeMode!=="autoW"&&<>
                <label className="lbl">{t.widthLbl}</label>
                <input type="number" min={1}
                  value={wInput}
                  style={{marginBottom:8, color: parseInt(wInput,10)>=1 ? "" : "#666"}}
                  onFocus={()=>{ dimEditingRef.current="w"; }}
                  onBlur={()=>{
                    dimEditingRef.current=null;
                    const v=parseInt(wInput,10);
                    if(!v||v<1) setWInput(String(settings.w)); // revert if invalid
                  }}
                  onChange={e=>{
                    setWInput(e.target.value);
                    const newW=parseInt(e.target.value,10);
                    if(!newW||newW<1) return;
                    if(settings.lockAspect&&settings.sizeMode==="fixed"){
                      const ratio=settings.w/settings.h;
                      setSettings(s=>({...s,w:newW,h:Math.round(newW/ratio)}));
                    } else {
                      setSettings(s=>({...s,w:newW}));
                    }
                  }}/>
              </>}

              {/* Alto */}
              {settings.sizeMode!=="autoH"&&<>
                <label className="lbl">{t.heightLbl}</label>
                <input type="number" min={1}
                  value={hInput}
                  style={{marginBottom:8, color: parseInt(hInput,10)>=1 ? "" : "#666"}}
                  onFocus={()=>{ dimEditingRef.current="h"; }}
                  onBlur={()=>{
                    dimEditingRef.current=null;
                    const v=parseInt(hInput,10);
                    if(!v||v<1) setHInput(String(settings.h)); // revert if invalid
                  }}
                  onChange={e=>{
                    setHInput(e.target.value);
                    const newH=parseInt(e.target.value,10);
                    if(!newH||newH<1) return;
                    if(settings.lockAspect&&settings.sizeMode==="fixed"){
                      const ratio=settings.w/settings.h;
                      setSettings(s=>({...s,h:newH,w:Math.round(newH*ratio)}));
                    } else {
                      setSettings(s=>({...s,h:newH}));
                    }
                  }}/>
              </>}

              {settings.sizeMode==="fixed"&&<div style={{fontSize:10,color:"#555",marginBottom:4}}>{t.ratioLbl}: {oW/dv}:{oH/dv}</div>}

              {/* Foco de recorte - 4 MODOS */}
              <label className="lbl" style={{marginTop:12}}>{t.cropModeLbl}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:4,marginBottom:8,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {[
                  {mode:"auto",label:t.cropModeAuto},
                  {mode:"manual",label:t.cropModeManual},
                  {mode:"face",label:t.cropModeFace},
                  {mode:"body",label:t.cropModeBody}
                ].map(({mode,label})=>{
                  const isActive = settings.detectionMode===mode;
                  const iconColor = isActive?"#fff":"#666";
                  
                  // Iconos SVG minimalistas
                  const icons = {
                    auto: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.196-14.196l-4.242 4.242m0 5.908l4.242 4.242M23 12h-6m-6 0H1m14.196 5.196l-4.242-4.242m0-5.908l-4.242-4.242"/></svg>,
                    manual: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
                    face: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>,
                    body: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v5m0 0l-3 6m3-6l3 6M9 12l-2-2m8 2l2-2"/></svg>
                  };
                  
                  return (
                    <button key={mode} onClick={async()=>{
                      // Si es modo ML y no han dicho "no volver a preguntar", mostrar diálogo
                      if((mode==="face"||mode==="body") && !mlDontShowAgain){
                        setMlWarningDialog({show:true, mode});
                      } else {
                        // Capturar valores AHORA (antes de setState)
                        const currentMode = mode;
                        const currentFocalAuto = mode !== "manual";
                        const currentSettings = settingsRef.current;
                        const currentSelId = selIdRef.current;
                        const currentMultiSel = new Set(multiSelRef.current);
                        
                        // Aplicar settings
                        setSettings(s=>({...s,detectionMode:mode,focalAuto:mode!=="manual"}));
                        
                        // Ejecutar INMEDIATAMENTE con valores capturados
                        const{w:oW,h:oH,focalPoint,adjustToTargetSize,poseNetEnabled}=currentSettings;
                        
                        // Determinar targets
                        let targets;
                        if(currentSelId && currentMultiSel.size===0) {
                          targets = [currentSelId];
                        } else if(currentMultiSel.size > 0) {
                          targets = [...currentMultiSel];
                        } else {
                          targets = filesRef.current.map(f=>f.id);
                        }
                        
                        if(!targets.length) return;
                        
                        setSmartBatch({running:true,done:0,total:targets.length});
                        let applied=0;
                        
                        for(let i=0;i<targets.length;i++){
                          const id=targets[i];
                          const f=filesRef.current.find(ff=>ff.id===id);
                          if(!f){ setSmartBatch(s=>({...s,done:s.done+1})); continue; }
                          let nc=null;
                          
                          if(currentMode === "face"){
                            nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
                          } else if(currentMode === "body"){
                            nc = await detectBodyCrop(f.ec, oW, oH, adjustToTargetSize, poseNetEnabled);
                          } else if(currentFocalAuto && currentMode === "auto"){
                            nc = await runSmartCrop(f.ec, oW, oH);
                          }
                          
                          if(!nc||nc.w<2||nc.h<2){
                            const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
                            nc=focalCrop(f.ec.width,f.ec.height,oW,oH,ax,ay);
                          }
                          const crop={...nc,auto:true};
                          setFiles(prev=>prev.map(ff=>ff.id===id?{...ff,crop}:ff));
                          applied++;
                          setSmartBatch(s=>({...s,done:s.done+1}));
                        }
                        
                        setSmartBatch({running:false,done:0,total:0});
                        const modeLabel = currentMode==="face"?t.detFaces:currentMode==="body"?t.detBodies:"";
                        const countMsg = targets.length===1 ? t.toastProcessed1 : t.toastCroppedN(applied);
                        showToast(modeLabel ? `✦ ${countMsg} (${modeLabel})` : `✦ ${countMsg}`);
                      }
                    }}
                      style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:isActive?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                        background:isActive?"#7c5cff":"transparent",
                        color:isActive?"#fff":"#555",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                      {icons[mode]}
                      <span>{label}</span>
                    </button>
                  );
                })}
              </div>

              {/* Toggle ajustar tamaño objetivo (solo para modos ML) */}
              {(settings.detectionMode==="face"||settings.detectionMode==="body")&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,padding:"8px",background:"#1a1a1a",borderRadius:4}}>
                  <label className="lbl" style={{marginBottom:0,fontSize:10}}>{t.adjustToTargetSize}</label>
                  <button onClick={()=>setSettings(s=>({...s,adjustToTargetSize:!s.adjustToTargetSize}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:9,fontWeight:600,border:"1px solid",borderRadius:3,padding:"2px 8px",cursor:"pointer",transition:"all .12s",
                      background:settings.adjustToTargetSize?"#7c5cff":"transparent",
                      borderColor:settings.adjustToTargetSize?"#7c5cff":"#2e2e2e",
                      color:settings.adjustToTargetSize?"#fff":"#555"}}>
                    {settings.adjustToTargetSize?"ON":"OFF"}
                  </button>
                </div>
              )}

              {/* V11.1: Toggle PoseNet (solo para modo cuerpo) */}
              {settings.detectionMode==="body"&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,padding:"8px",background:"#1a1a1a",borderRadius:4}}>
                  <label className="lbl" style={{marginBottom:0,fontSize:10}}>
                    {t.poseNetRefinement}
                  </label>
                  <button onClick={()=>setSettings(s=>({...s,poseNetEnabled:!s.poseNetEnabled}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:9,fontWeight:600,border:"1px solid",borderRadius:3,padding:"2px 8px",cursor:"pointer",transition:"all .12s",
                      background:settings.poseNetEnabled?"#7c5cff":"transparent",
                      borderColor:settings.poseNetEnabled?"#7c5cff":"#2e2e2e",
                      color:settings.poseNetEnabled?"#fff":"#555"}}>
                    {settings.poseNetEnabled?"ON":"OFF"}
                  </button>
                </div>

              {/* Info de cada modo */}

              <button onClick={async()=>{
                const currentMode = mlWarningDialog.mode;
                const currentSettings = settingsRef.current;
                const currentSelId = selIdRef.current;
                const currentMultiSel = new Set(multiSelRef.current);
                
                setMlWarningDialog({show:false,mode:null});
                setSettings(s=>({...s,detectionMode:currentMode,focalAuto:true}));
                
                // Ejecutar INMEDIATAMENTE con valores capturados
                const{w:oW,h:oH,focalPoint,adjustToTargetSize,poseNetEnabled}=currentSettings;
                
                // Determinar targets
                let targets;
                if(currentSelId && currentMultiSel.size===0) {
                  targets = [currentSelId];
                } else if(currentMultiSel.size > 0) {
                  targets = [...currentMultiSel];
                } else {
                  targets = filesRef.current.map(f=>f.id);
                }
                
                if(!targets.length) return;
                
                setSmartBatch({running:true,done:0,total:targets.length});
                let applied=0;
                
                for(let i=0;i<targets.length;i++){
                  const id=targets[i];
                  const f=filesRef.current.find(ff=>ff.id===id);
                  if(!f){ setSmartBatch(s=>({...s,done:s.done+1})); continue; }
                  let nc=null;
                  
                  if(currentMode === "face"){
                    nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
                  } else if(currentMode === "body"){
                    nc = await detectBodyCrop(f.ec, oW, oH, adjustToTargetSize, poseNetEnabled);
                  }
                  
                  if(!nc||nc.w<2||nc.h<2){
                    const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
                    nc=focalCrop(f.ec.width,f.ec.height,oW,oH,ax,ay);
                  }
                  const crop={...nc,auto:true};
                  setFiles(prev=>prev.map(ff=>ff.id===id?{...ff,crop}:ff));
                  applied++;
                  setSmartBatch(s=>({...s,done:s.done+1}));
                }
                
                setSmartBatch({running:false,done:0,total:0});
                const modeLabel = currentMode==="face"?t.detFaces:currentMode==="body"?t.detBodies:"";
                const countMsg = targets.length===1 ? t.toastProcessed1 : t.toastCroppedN(applied);
                showToast(modeLabel ? `✦ ${countMsg} (${modeLabel})` : `✦ ${countMsg}`);
              }}
                style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:600,border:"none",borderRadius:5,padding:"10px",cursor:"pointer",background:"#7c5cff",color:"#fff"}}>
                {t.continueBtn}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ZIRME />);
</script>
</body>
</html>
