<script>
  let _dc = 0;
  const ov = () => document.getElementById("drop-overlay");
  window.addEventListener("dragenter", e => { e.preventDefault(); if (++_dc===1) ov().classList.add("show"); });
  window.addEventListener("dragleave", e => { if (--_dc<=0){_dc=0;ov().classList.remove("show");} });
  window.addEventListener("dragover",  e => { e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
  window.addEventListener("drop",      e => { e.preventDefault();_dc=0;ov().classList.remove("show"); window._zirmeDrop&&window._zirmeDrop(e.dataTransfer.files); });
</script>

/* ── Helpers ──────────────────────────────────────────────────────────── */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._to); t._to = setTimeout(()=>t.classList.remove("show"), 2600);
}
/* ── Cross-browser range fill ─────────────────────────────────────────── */
function paintRange(el) {
  const min = parseFloat(el.min) || 0, max = parseFloat(el.max) || 100;
  const pct = ((el.value - min) / (max - min)) * 100;
  el.style.background = `linear-gradient(to right, #7c5cff ${pct}%, #2e2e2e ${pct}%)`;
}
// Listen for all input events on range sliders (captures React-driven changes too)
document.addEventListener("input", e => { if (e.target.type === "range") paintRange(e.target); });
// Observe DOM for new range inputs and paint them on insertion
new MutationObserver(muts => {
  for (const m of muts) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.tagName === "INPUT" && n.type === "range") paintRange(n);
    else if (n.querySelectorAll) n.querySelectorAll('input[type=range]').forEach(paintRange);
  }
}).observe(document.body, { childList: true, subtree: true });
// Paint any already-existing range inputs
document.querySelectorAll('input[type=range]').forEach(paintRange);
// Periodic repaint for React-driven value updates (lightweight, ~10 elements max)
setInterval(() => document.querySelectorAll('input[type=range]').forEach(paintRange), 250);

function setZipProgress(p) {
  const el = document.getElementById("zip-progress");
  if(el) el.style.transform = `scaleX(${p})`;
}

/* ── smartcrop helper ─────────────────────────────────────────────────── */
// Wraps smartcrop.js with a graceful fallback to center-crop.
// Accepts an HTMLCanvasElement (file.ec) and target dimensions.
// Returns a crop object {x,y,w,h} in original image pixel space.
async function runSmartCrop(canvas, outW, outH) {
  if(typeof smartcrop === "undefined") return null;
  try {
    const result = await smartcrop.crop(canvas, { width: outW, height: outH, minScale: 1.0 });
    const tc = result.topCrop;
    return { x: Math.round(tc.x), y: Math.round(tc.y), w: Math.round(tc.width), h: Math.round(tc.height) };
  } catch(e) {
    return null; // caller falls back to center crop
  }
}

/* ── ML-based Detection Functions ─────────────────────────────────────── */
let faceApiLoaded = false;
let cocoSsdModel = null;
let mlLibsLoading = false;
let mlLibsLoaded = false;

// Helper para cargar scripts dinámicamente
function loadScript(src) {
  return new Promise((resolve, reject) => {
    // Verificar si ya está cargado
    if (document.querySelector(`script[src="${src}"]`)) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// Cargar todas las ML libraries de una vez
async function ensureMLLibs() {
  if (mlLibsLoaded) return true;
  if (mlLibsLoading) {
    // Esperar a que termine la carga en progreso
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (mlLibsLoaded || !mlLibsLoading) {
          clearInterval(check);
          resolve(mlLibsLoaded);
        }
      }, 100);
    });
  }
  
  mlLibsLoading = true;
  try {
    await Promise.all([
      loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0'),
      loadScript('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js')
    ]);
    // COCO-SSD depende de TensorFlow, cargar después
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3');
    mlLibsLoaded = true;
    return true;
  } catch(e) {
    console.warn("ML libraries load failed:", e);
    return false;
  } finally {
    mlLibsLoading = false;
  }
}

async function loadFaceApi() {
  if(faceApiLoaded) return true;
  
  // Asegurar que las ML libs estén cargadas
  const libsOk = await ensureMLLibs();
  if(!libsOk || typeof faceapi === "undefined") return false;
  
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model');
    faceApiLoaded = true;
    return true;
  } catch(e) {
    console.warn("Face-API load failed:", e);
    return false;
  }
}

async function loadCocoSsd() {
  if(cocoSsdModel) return true;
  
  // Asegurar que las ML libs estén cargadas
  const libsOk = await ensureMLLibs();
  if(!libsOk || typeof cocoSsd === "undefined") return false;
  
  try {
    cocoSsdModel = await cocoSsd.load();
    return true;
  } catch(e) {
    console.warn("COCO-SSD load failed:", e);
    return false;
  }
}

async function detectFacesCrop(canvas, outW, outH, adjustToTargetSize = true) {
  const loaded = await loadFaceApi();
  if(!loaded) return null;
  
  try {
    const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
    if(!detections || detections.length === 0) return null;
    
    // Encontrar el rostro más grande o más centrado
    let bestFace = detections[0];
    if(detections.length > 1) {
      bestFace = detections.reduce((best, current) => {
        const bestSize = best.box.width * best.box.height;
        const currentSize = current.box.width * current.box.height;
        return currentSize > bestSize ? current : best;
      });
    }
    
    const box = bestFace.box;
    const targetRatio = outW / outH;
    
    if(adjustToTargetSize) {
      // MODO: Mantener tamaño mínimo (no bajar del objetivo, pero puede ser mayor)
      // Calcular el crop óptimo para la cara detectada con margen
      const margin = 0.5; // 50% de margen alrededor de la cara
      let cropW = box.width * (1 + margin * 2);
      let cropH = box.height * (1 + margin * 2);
      
      // Ajustar al ratio objetivo
      const currentRatio = cropW / cropH;
      if(currentRatio > targetRatio) {
        cropH = cropW / targetRatio;
      } else {
        cropW = cropH * targetRatio;
      }
      
      // CRÍTICO: No permitir que sea menor que el tamaño objetivo
      if(cropW < outW || cropH < outH) {
        const scale = Math.max(outW / cropW, outH / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }
      
      // Si es más grande que el canvas, escalar
      if(cropW > canvas.width || cropH > canvas.height) {
        const scale = Math.min(canvas.width / cropW, canvas.height / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }
      
      // Centrar en el rostro (priorizar mostrar más espacio arriba)
      let cropX = box.x + box.width / 2 - cropW / 2;
      let cropY = box.y + box.height / 2 - cropH / 2 - box.height * 0.3;
      
      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      
      return { 
        x: Math.round(cropX), 
        y: Math.round(cropY), 
        w: Math.round(cropW), 
        h: Math.round(cropH) 
      };
    } else {
      // MODO: Crop automático (ajustado a la cara)
      const margin = 0.15;
      let cropW = box.width * (1 + margin * 2);
      let cropH = box.height * (1 + margin * 2);
      
      // Ajustar al ratio objetivo manteniendo la cara bien encuadrada
      const currentRatio = cropW / cropH;
      if(currentRatio > targetRatio) {
        cropH = cropW / targetRatio;
      } else {
        cropW = cropH * targetRatio;
      }
      
      // Centrar en el rostro (priorizar mostrar más espacio arriba)
      let cropX = box.x + box.width / 2 - cropW / 2;
      let cropY = box.y + box.height / 2 - cropH / 2 - box.height * 0.2;
      
      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      
      return { 
        x: Math.round(cropX), 
        y: Math.round(cropY), 
        w: Math.round(cropW), 
        h: Math.round(cropH) 
      };
    }
  } catch(e) {
    console.warn("Face detection failed:", e);
    return null;
  }
}

async function detectBodyCrop(canvas, outW, outH, adjustToTargetSize = true) {
  // Primero intentar detectar rostro para saber dónde está la cabeza
  const faceLoaded = await loadFaceApi();
  const cocoLoaded = await loadCocoSsd();
  
  if(!cocoLoaded) return null;
  
  try {
    const predictions = await cocoSsdModel.detect(canvas);
    const people = predictions.filter(p => p.class === 'person');
    
    if(people.length === 0) return null;
    
    // Encontrar la persona más grande
    let bestPerson = people[0];
    if(people.length > 1) {
      bestPerson = people.reduce((best, current) => {
        const bestSize = best.bbox[2] * best.bbox[3];
        const currentSize = current.bbox[2] * current.bbox[3];
        return currentSize > bestSize ? current : best;
      });
    }
    
    let [x, y, width, height] = bestPerson.bbox;
    
    // SIEMPRE omitir la cabeza (asumiendo que el 20% superior del cuerpo es la cabeza)
    // Esto funciona incluso cuando la cara está tapada por un teléfono
    const headHeight = height * 0.25; // 25% superior = cabeza + cuello
    y = y + headHeight;
    height = height - headHeight;
    
    // Si además se detectó la cara, ajustar más precisamente desde clavícula
    if(faceLoaded) {
      try {
        const faceDetections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
        if(faceDetections && faceDetections.length > 0) {
          // Encontrar el rostro más grande (probablemente el de esta persona)
          const face = faceDetections.reduce((best, current) => {
            const bestSize = best.box.width * best.box.height;
            const currentSize = current.box.width * current.box.height;
            return currentSize > bestSize ? current : best;
          });
          
          // Ajustar el inicio del crop para empezar desde la clavícula (debajo de la cara)
          const neckY = face.box.y + face.box.height + face.box.height * 0.5; // 50% debajo de la cara = clavícula
          if(neckY > bestPerson.bbox[1] && neckY < bestPerson.bbox[1] + bestPerson.bbox[3]) {
            // Usar la detección de cara si está disponible (más precisa)
            const originalY = bestPerson.bbox[1];
            y = neckY;
            height = bestPerson.bbox[3] - (neckY - originalY);
          }
        }
      } catch(e) {
        // Si falla la detección de rostro, usar el 25% que ya calculamos arriba
      }
    }
    
    const targetRatio = outW / outH;
    
    if(adjustToTargetSize) {
      // MODO: Mantener tamaño mínimo (no bajar del objetivo, pero puede ser mayor)
      // Calcular el crop óptimo para el cuerpo detectado
      let cropW = width * 1.1; // 10% de margen alrededor del cuerpo
      let cropH = height * 1.1;
      
      // Ajustar al ratio objetivo
      const currentRatio = cropW / cropH;
      if(currentRatio > targetRatio) {
        // Crop es más ancho, ajustar altura
        cropH = cropW / targetRatio;
      } else {
        // Crop es más alto, ajustar ancho
        cropW = cropH * targetRatio;
      }
      
      // CRÍTICO: No permitir que sea menor que el tamaño objetivo
      if(cropW < outW || cropH < outH) {
        const scale = Math.max(outW / cropW, outH / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }
      
      // Si es más grande que el canvas, escalar
      if(cropW > canvas.width || cropH > canvas.height) {
        const scale = Math.min(canvas.width / cropW, canvas.height / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }
      
      // Centrar horizontalmente en el cuerpo
      let cropX = x + width / 2 - cropW / 2;
      // Alinear verticalmente desde el cuello
      let cropY = y;
      
      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      
      return { 
        x: Math.round(cropX), 
        y: Math.round(cropY), 
        w: Math.round(cropW), 
        h: Math.round(cropH) 
      };
    } else {
      // MODO: Crop automático (ajustado al cuerpo)
      const margin = 0.1;
      let cropW = width * (1 + margin * 2);
      let cropH = height * (1 + margin * 2);
      
      if(cropW / cropH > targetRatio) {
        cropH = cropW / targetRatio;
      } else {
        cropW = cropH * targetRatio;
      }
      
      // Centrar en el cuerpo (sin cabeza)
      let cropX = x + width / 2 - cropW / 2;
      let cropY = y + height / 2 - cropH / 2;
      
      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      
      return { 
        x: Math.round(cropX), 
        y: Math.round(cropY), 
        w: Math.round(cropW), 
        h: Math.round(cropH) 
      };
    }
  } catch(e) {
    console.warn("Body detection failed:", e);
    return null;
  }
}

/* ── focalCrop — anchor-based auto crop ───────────────────────────────── */
// ax/ay ∈ {0=start, 0.5=center, 1=end}
// The chosen anchor point determines which region of the image fills the output.
function focalCrop(iW, iH, oW, oH, ax, ay) {
  const ta=oW/oH, ia=iW/iH;
  let cW=iW, cH=iH;
  if(ia>ta) cW=iH*ta; else cH=iW/ta;
  return { x:Math.round(ax*(iW-cW)), y:Math.round(ay*(iH-cH)), w:Math.round(cW), h:Math.round(cH) };
}
function snapCanvas(c) {
  const s = document.createElement("canvas"); s.width=c.width; s.height=c.height;
  s.getContext("2d").drawImage(c,0,0); return s;
}
function gcd(a,b){ return b===0?a:gcd(b,a%b); }

function clampCrop(crop, iW, iH, ratio) {
  let { x, y, w, h } = crop;
  w=Math.max(10,w); h=Math.max(10,h);
  // Fit dimensions within image, respecting ratio if locked
  if(ratio){
    w=Math.min(w,iW); h=Math.min(h,iH);
    if(w/h>ratio) w=h*ratio; else h=w/ratio;
    if(w>iW){w=iW;h=w/ratio;} if(h>iH){h=iH;w=h*ratio;}
  } else {
    w=Math.min(w,iW); h=Math.min(h,iH);
  }
  // Clamp position so crop sits inside image
  x=Math.max(0,Math.min(x,iW-w));
  y=Math.max(0,Math.min(y,iH-h));
  // Final strict guarantee: right/bottom edges never exceed image bounds
  w=Math.min(w,iW-x); h=Math.min(h,iH-y);
  return {x,y,w,h};
}

const HANDLES = [
  {hx:0,  hy:0,  cx:"nw-resize"},{hx:0.5,hy:0,  cx:"n-resize"},{hx:1,hy:0,cx:"ne-resize"},
  {hx:0,  hy:0.5,cx:"w-resize"}, {hx:1,  hy:0.5,cx:"e-resize"},
  {hx:0,  hy:1,  cx:"sw-resize"},{hx:0.5,hy:1,  cx:"s-resize"}, {hx:1,hy:1,cx:"se-resize"},
];
const HS = 8;

/* ── drawCropShadow ───────────────────────────────────────────────────── */
function drawCropShadow(ctx, cr, sc, offX, offY, iW, iH) {
  if(!cr||cr.w<2) return;
  const cx=cr.x*sc+offX, cy=cr.y*sc+offY;
  const cw=cr.w*sc, ch=cr.h*sc;
  const r=offX+iW*sc, b=offY+iH*sc;

  // Darken outside
  ctx.fillStyle="rgba(0,0,0,0.58)";
  ctx.fillRect(offX,offY,r-offX,cy-offY);
  ctx.fillRect(offX,cy+ch,r-offX,b-(cy+ch));
  ctx.fillRect(offX,cy,cx-offX,ch);
  ctx.fillRect(cx+cw,cy,r-(cx+cw),ch);

  // Outer border — double-stroke (no shadowBlur: keeps GPU path, avoids lag on large crops)
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(0,0,0,0.75)"; ctx.lineWidth=3.5;
  ctx.strokeRect(cx,cy,cw,ch);
  ctx.strokeStyle="#ffffff"; ctx.lineWidth=1.5;
  ctx.strokeRect(cx,cy,cw,ch);

  // Rule of thirds — batched into a single path (4× fewer draw calls)
  ctx.beginPath();
  for(let i=1;i<3;i++){
    ctx.moveTo(cx+cw*i/3, cy+1); ctx.lineTo(cx+cw*i/3, cy+ch-1);
    ctx.moveTo(cx+1, cy+ch*i/3); ctx.lineTo(cx+cw-1, cy+ch*i/3);
  }
  ctx.strokeStyle="rgba(255,255,255,0.65)"; ctx.lineWidth=0.75;
  ctx.stroke();

  // Handles — shadow via dark underlay rect (no shadowBlur)
  ctx.fillStyle="rgba(0,0,0,0.75)";
  HANDLES.forEach(({hx,hy})=>{
    const hpx=cx+cw*hx, hpy=cy+ch*hy;
    ctx.fillRect(hpx-HS/2-1.5, hpy-HS/2-1.5, HS+3, HS+3);
  });
  ctx.fillStyle="#ffffff";
  HANDLES.forEach(({hx,hy})=>{
    const hpx=cx+cw*hx, hpy=cy+ch*hy;
    ctx.fillRect(hpx-HS/2, hpy-HS/2, HS, HS);
  });
}

function hitHandle(px,py,cr,sc,offX,offY) {
  if(!cr||cr.w<2) return -1;
  const cx=cr.x*sc+offX, cy=cr.y*sc+offY, cw=cr.w*sc, ch=cr.h*sc;
  for(let i=0;i<HANDLES.length;i++){
    const {hx,hy}=HANDLES[i];
    if(Math.abs(px-(cx+cw*hx))<HS+4 && Math.abs(py-(cy+ch*hy))<HS+4) return i;
  }
  return -1;
}

/* ── buildRows ────────────────────────────────────────────────────────── */
function buildRows(files, targetH, containerW, gap) {
  if(!files.length||!containerW) return [];
  const rows=[]; let row=[], rowRatioSum=0;
  for(const f of files) {
    const ratio=(f.ec?.width||1)/(f.ec?.height||1);
    row.push({file:f,ratio}); rowRatioSum+=ratio;
    const totalW=rowRatioSum*targetH+gap*(row.length-1);
    if(totalW>=containerW) {
      const scale=(containerW-gap*(row.length-1))/(rowRatioSum*targetH);
      const h=Math.round(targetH*scale);
      rows.push(row.map(it=>({file:it.file,w:Math.round(it.ratio*h),h})));
      row=[]; rowRatioSum=0;
    }
  }
  if(row.length) rows.push(row.map(it=>({file:it.file,w:Math.round(it.ratio*targetH),h:targetH})));
  return rows;
}

/* ── ImageCell ────────────────────────────────────────────────────────── */
function ImageCell({ file, isSelected, isMultiSel, settings, cellH, t,
    onSelect, onCropChange, onUndoPush, onRemove, onEdit, onPreview, tick,
    dragging, onDragStart, onDragEnter, onDragEnd }) {
  const canvasRef = useRef(null);
  const drag = useRef({mode:"none",startImg:null,cropOrig:null,handleIdx:-1});

  const getT = useCallback(()=>{
    const c=canvasRef.current; if(!c) return null;
    const W=c.width, H=c.height, img=file.ec;
    const sc=W/img.width;
    return {sc,offX:0,offY:0,dW:W,dH:H,W,H};
  },[file]);

  const evToCanvas = useCallback((e)=>{
    const c=canvasRef.current; if(!c) return null;
    const rect=c.getBoundingClientRect();
    return {px:(e.clientX-rect.left)*(c.width/rect.width),py:(e.clientY-rect.top)*(c.height/rect.height)};
  },[]);

  const evToImg = useCallback((e)=>{
    const cp=evToCanvas(e); if(!cp) return null;
    const tt=getT(); if(!tt) return null;
    return {x:(cp.px-tt.offX)/tt.sc,y:(cp.py-tt.offY)/tt.sc};
  },[evToCanvas,getT]);

  useEffect(()=>{
    const c=canvasRef.current; if(!c) return;
    const img=file.ec;
    const cw=c.offsetWidth; if(cw>0) c.width=cw;
    c.height=cellH;
    const W=c.width, H=c.height;
    const ctx=c.getContext("2d");
    const sc=W/img.width;
    ctx.fillStyle="#202020"; ctx.fillRect(0,0,W,H);
    
    // Draw image
    ctx.drawImage(img,0,0,W,H);
    
    // Draw border preview if enabled
    if(settings.borderW > 0){
      const borderSc = settings.borderW * sc; // Scale border to thumbnail size
      ctx.strokeStyle = settings.borderColor;
      ctx.lineWidth = borderSc * 2; // Double width for visibility
      ctx.strokeRect(0, 0, W, H);
    }
    
    const cr=file.crop;
    if(cr?.w>2) drawCropShadow(ctx,cr,sc,0,0,img.width,img.height);
    // Filename bar
    ctx.fillStyle="rgba(0,0,0,0.65)"; ctx.fillRect(0,H-22,W,22);
    ctx.fillStyle="#888"; ctx.font="500 10px Inter,sans-serif";
    const nm=file.name.length>38?file.name.slice(0,36)+"…":file.name;
    ctx.fillText(nm,6,H-7);
    // Top info bar
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,0,W,22);
    ctx.font="500 10px Inter,sans-serif";
    if(cr?.w>2){
      ctx.fillStyle="#a78bfa"; ctx.fillText(`✂ ${Math.round(cr.w)}×${Math.round(cr.h)}px`,6,15);
    } else {
      ctx.fillStyle="#444"; ctx.fillText(t?.noCrop||"no crop",6,15);
    }
  },[file,file.crop,cellH,tick,settings.borderW,settings.borderColor]);

  const onMouseDown = useCallback((e)=>{
    if(e.button!==0) return;
    onSelect(file.id, e.shiftKey);
    const cp=evToCanvas(e); const p=evToImg(e);
    if(!cp||!p) return;
    const tt=getT(); if(!tt) return;
    const cr=file.crop;
    const hi=cr&&cr.w>2?hitHandle(cp.px,cp.py,cr,tt.sc,tt.offX,tt.offY):-1;
    if(hi>=0){ onUndoPush(file.id); drag.current={mode:"handle",startImg:p,cropOrig:{...cr},handleIdx:hi}; e.preventDefault(); return; }
    if(cr&&cr.w>2&&p.x>=cr.x&&p.x<=cr.x+cr.w&&p.y>=cr.y&&p.y<=cr.y+cr.h){
      onUndoPush(file.id); drag.current={mode:"move",startImg:p,cropOrig:{...cr},handleIdx:-1}; e.preventDefault(); return;
    }
    if(p.x>=0&&p.x<=file.ec.width&&p.y>=0&&p.y<=file.ec.height){
      onUndoPush(file.id); drag.current={mode:"new",startImg:p,cropOrig:null,handleIdx:-1};
      onCropChange(file.id,{x:p.x,y:p.y,w:0,h:0}); e.preventDefault();
    }
  },[file,evToCanvas,evToImg,getT,onSelect,onCropChange,onUndoPush]);

  const onMouseMove = useCallback((e)=>{
    // ── Cursor update — always, independent of drag state ──────────────────
    const cp2=evToCanvas(e); const pi2=evToImg(e);
    if(cp2&&pi2){
      const tt2=getT(); const cr2=file.crop;
      if(tt2&&cr2&&cr2.w>2){
        const cv=canvasRef.current;
        if(cv){
          const hi2=hitHandle(cp2.px,cp2.py,cr2,tt2.sc,tt2.offX,tt2.offY);
          cv.style.cursor=hi2>=0?HANDLES[hi2].cx:(pi2.x>=cr2.x&&pi2.x<=cr2.x+cr2.w&&pi2.y>=cr2.y&&pi2.y<=cr2.y+cr2.h?"move":"crosshair");
        }
      }
    }
    const d=drag.current; if(d.mode==="none") return;
    const p=evToImg(e); if(!p) return;
    const ratio=settings.w/settings.h;
    const iW=file.ec.width, iH=file.ec.height;
    if(d.mode==="new"){
      const rawW=p.x-d.startImg.x, rawH=p.y-d.startImg.y;
      let cW=Math.abs(rawW),cH=Math.abs(rawH);
      if(cW/(cH||0.001)>ratio) cH=cW/ratio; else cW=cH*ratio;
      const nx=rawW>=0?d.startImg.x:d.startImg.x-cW;
      const ny=rawH>=0?d.startImg.y:d.startImg.y-cH;
      onCropChange(file.id,clampCrop({x:nx,y:ny,w:cW,h:cH},iW,iH,ratio));
    } else if(d.mode==="move"){
      const dx=p.x-d.startImg.x, dy=p.y-d.startImg.y;
      onCropChange(file.id,clampCrop({...d.cropOrig,x:d.cropOrig.x+dx,y:d.cropOrig.y+dy},iW,iH,ratio));
    } else if(d.mode==="handle"){
      const orig=d.cropOrig, hi=d.handleIdx, sp=d.startImg;
      const dx=p.x-sp.x, dy=p.y-sp.y;
      let {x,y,w,h}={...orig};
      const {hx,hy}=HANDLES[hi];
      // Anchor-aware resize: keep opposite edge fixed, pre-clamp to image boundaries
      if(hx===0){ const r=orig.x+orig.w; x=Math.max(0,Math.min(orig.x+dx,r-10)); w=r-x; }
      if(hx===1){ w=Math.max(10,Math.min(orig.w+dx,iW-orig.x)); x=orig.x; }
      if(hy===0){ const b=orig.y+orig.h; y=Math.max(0,Math.min(orig.y+dy,b-10)); h=b-y; }
      if(hy===1){ h=Math.max(10,Math.min(orig.h+dy,iH-orig.y)); y=orig.y; }
      if(hx===0.5){w=h*ratio;} else if(hy===0.5){h=w/ratio;}
      else{if(Math.abs(dx)>=Math.abs(dy))h=w/ratio; else w=h*ratio; if(hx===0)x=orig.x+(orig.w-w); if(hy===0)y=orig.y+(orig.h-h);}
      onCropChange(file.id,clampCrop({x,y,w,h},iW,iH,ratio)); // pass ratio so clamping maintains proportion
    }
  },[file,evToCanvas,evToImg,getT,settings,onCropChange]);

  const onMouseUp = useCallback(()=>{
    drag.current.mode="none";
    const cv=canvasRef.current; if(cv) cv.style.cursor=""; // revert to crosshair from cell-wrap CSS
  },[]);

  const cls = `cell-wrap${isSelected?" selected":""}${isMultiSel?" multi-sel":""}${dragging?" drag-over":""}`;

  return (
    <div className={cls}
      draggable onDragStart={()=>onDragStart(file.id)}
      onDragEnter={()=>onDragEnter(file.id)} onDragEnd={onDragEnd}
      onDragOver={e=>e.preventDefault()}>
      <canvas ref={canvasRef} style={{display:"block",width:"100%"}}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove}
        onMouseUp={onMouseUp} onMouseLeave={onMouseUp} />
      
      {/* Checkbox de deselección - solo visible si está seleccionada */}
      {isSelected&&(
        <button onClick={(e)=>{e.stopPropagation();onSelect(null);}} 
                style={{position:"absolute",top:6,right:6,width:24,height:24,borderRadius:4,border:"2px solid #7c5cff",background:"rgba(124,92,255,0.9)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s",zIndex:5,boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}
                onMouseEnter={e=>e.currentTarget.style.background="#7c5cff"}
                onMouseLeave={e=>e.currentTarget.style.background="rgba(124,92,255,0.9)"}
                title="Deseleccionar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      )}
      
      <div className="hover-btns">
        {file.crop?.w>2&&<button className="hbtn hbtn-prev" onClick={e=>{e.stopPropagation();onPreview(file.id);}}>{t?.previewBtn||"👁"}</button>}
        <button className="hbtn hbtn-edit" onClick={e=>{e.stopPropagation();onEdit(file.id);}}>{t?.editBtn||"✎ Edit"}</button>
        <button className="hbtn hbtn-del"  onClick={e=>{e.stopPropagation();onRemove(file.id);}}>×</button>
      </div>
    </div>
  );
}

// OPTIMIZACIÓN: React.memo previene re-renders cuando las props no han cambiado
const ImageCellMemo = React.memo(ImageCell, (prevProps, nextProps) => {
  // Solo re-renderizar si cambió algo relevante de ESTA imagen específica
  return prevProps.file.id === nextProps.file.id &&
         prevProps.file.crop === nextProps.file.crop &&
         prevProps.file.ec === nextProps.file.ec &&
         prevProps.isSelected === nextProps.isSelected &&
         prevProps.isMultiSel === nextProps.isMultiSel &&
         prevProps.cellH === nextProps.cellH &&
         prevProps.dragging === nextProps.dragging &&
         prevProps.tick === nextProps.tick;
});

/* ── JustifiedGrid ────────────────────────────────────────────────────── */
function JustifiedGrid({ files, cellH, settings, selId, multiSel, t, tick,
    onSelect, onCropChange, onUndoPush, onRemove, onEdit, onPreview, loadFiles, onReorder }) {
  const containerRef = useRef(null);
  const [containerW, setContainerW] = useState(0);
  const [dragSrc, setDragSrc] = useState(null);
  const [dragOver, setDragOver] = useState(null);
  const GAP = 10;

  useEffect(()=>{
    const el=containerRef.current; if(!el) return;
    const ro=new ResizeObserver(entries=>setContainerW(entries[0].contentRect.width));
    ro.observe(el); setContainerW(el.clientWidth);
    return()=>ro.disconnect();
  },[]);

  const rows = useMemo(()=>containerW>0?buildRows(files,cellH,containerW,GAP):[],[files,cellH,containerW]);

  // Calculate if "Add More" button fits in the last row
  const addBtnMinWidth = Math.round(cellH * 0.6);
  const lastRowHasSpace = useMemo(() => {
    if (rows.length === 0) return false;
    const lastRow = rows[rows.length - 1];
    const usedWidth = lastRow.reduce((sum, item) => sum + item.w, 0) + (lastRow.length - 1) * GAP;
    const remainingWidth = containerW - usedWidth;
    return remainingWidth >= (addBtnMinWidth + GAP);
  }, [rows, containerW, addBtnMinWidth, GAP]);

  const handleDragStart = useCallback((id)=>setDragSrc(id),[]);
  const handleDragEnter = useCallback((id)=>setDragOver(id),[]);
  const handleDragEnd   = useCallback(()=>{
    if(dragSrc&&dragOver&&dragSrc!==dragOver) onReorder(dragSrc,dragOver);
    setDragSrc(null); setDragOver(null);
  },[dragSrc,dragOver,onReorder]);

  return (
    <div ref={containerRef} style={{width:"100%"}}>
      {rows.map((row,ri)=>{
        const isLastRow = ri === rows.length - 1;
        const showButtonInRow = isLastRow && lastRowHasSpace && files.length > 0;
        return (
          <div key={ri} style={{display:"flex",gap:GAP,marginBottom:GAP,alignItems:"flex-start"}}>
            {row.map(({file,w,h})=>(
              <div key={file.id} style={{width:w,flexShrink:0}}>
                <ImageCellMemo file={file} isSelected={file.id===selId}
                  isMultiSel={multiSel.has(file.id)} settings={settings} cellH={h} t={t} tick={tick}
                  onSelect={onSelect} onCropChange={onCropChange}
                  onUndoPush={onUndoPush} onRemove={onRemove} onEdit={onEdit} onPreview={onPreview}
                  dragging={file.id===dragOver}
                  onDragStart={handleDragStart} onDragEnter={handleDragEnter} onDragEnd={handleDragEnd} />
              </div>
            ))}
            {/* Add More button in the last row only if there's space */}
            {showButtonInRow && (
              <label style={{height:cellH+"px",display:"inline-flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:"2px dashed #252525",borderRadius:8,cursor:"pointer",color:"#303030",gap:8,transition:"all .15s",minWidth:addBtnMinWidth+"px",flexShrink:0}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="#383838";e.currentTarget.style.color="#555";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="#252525";e.currentTarget.style.color="#303030";}}>
                <span style={{fontSize:28}}>+</span>
                <span style={{fontSize:12,fontWeight:500}}>{t.addMore}</span>
                <input type="file" accept="image/*" multiple onChange={e=>loadFiles(e.target.files)} style={{display:"none"}} />
              </label>
            )}
          </div>
        );
      })}
      {/* Add More button in new row if it doesn't fit in last row, or if no files */}
      {(!lastRowHasSpace || files.length === 0) && (
        <div style={{display:"flex",gap:GAP,marginBottom:GAP}}>
          <label style={{height:cellH+"px",display:"inline-flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:"2px dashed #252525",borderRadius:8,cursor:"pointer",color:"#303030",gap:8,transition:"all .15s",minWidth:addBtnMinWidth+"px",flexShrink:0}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#383838";e.currentTarget.style.color="#555";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#252525";e.currentTarget.style.color="#303030";}}>
            <span style={{fontSize:28}}>+</span>
            <span style={{fontSize:12,fontWeight:500}}>{t.addMore}</span>
            <input type="file" accept="image/*" multiple onChange={e=>loadFiles(e.target.files)} style={{display:"none"}} />
          </label>
        </div>
      )}
    </div>
  );
}

/* ── EditOverlay ──────────────────────────────────────────────────────── */
function EditOverlay({ file, settings, blurCfg, t, onClose, onCropChange, onUndoPush, panelOpen, onBlurCfgChange }) {
  const canvasRef     = useRef(null);
  const contRef       = useRef(null);
  const blurCircleRef = useRef(null);
  const frameRef      = useRef(0);

  // Tool state — only affects toolbar rendering, not draw loop
  const [tool,           setTool]         = useState("crop");
  const [freeCrop,       setFreeCrop]     = useState(false);
  const [ready,          setReady]        = useState(false);
  const [smartCropping,  setSmartCropping]= useState(false); // async smart-crop in progress
  
  // NUEVAS HERRAMIENTAS: Estados de configuración
  const [eraserCfg, setEraserCfg] = useState({
    size: 50,
    mode: "transparent", // "transparent" | "solid" | "smart"
    color: "#ffffff",  // Blanco por defecto (más visible)
    opacity: 100,
    hardness: 50
  });
  
  const [annotateCfg, setAnnotateCfg] = useState({
    mode: "draw", // "draw" | "text"
    color: "#ffffff",  // Blanco por defecto
    thickness: 3,
    opacity: 80,
    hardness: 70,
    font: "Inter",
    fontSize: 24
  });
  
  // Estado para editor de texto interactivo (tipo Photoshop)
  const [activeText, setActiveText] = useState(null); // {x, y, width, height, text, editing, dragging}
  
  // Estado para color picker personalizado (evitar popup nativo)
  const [showColorPicker, setShowColorPicker] = useState({show: false, target: null}); // target: "eraser" | "annotate"
  
  // Estado para handles de color dial
  const [colorDialHandles, setColorDialHandles] = useState({eraser: 0, annotate: 0}); // 0-1 position

  // All hot-path values live in refs — NEVER setState during drag/pan/draw
  const zoomRef    = useRef(1);
  const panRef     = useRef({x:0,y:0});
  const cropRef    = useRef(file.crop);   // local working copy, committed on mouseUp
  const fitZRef    = useRef(1);
  const toolRef    = useRef("crop");
  const freeCropRef= useRef(false);
  const blurCfgRef = useRef(blurCfg);
  const eraserCfgRef = useRef(eraserCfg);
  const annotateCfgRef = useRef(annotateCfg);
  const settingsRef2 = useRef(settings);

  const isDraggingRef = useRef(false);   // true while any drag/pan gesture is live
  const fileRef       = useRef(file);    // stable mirror of file prop — prevents drawNow recreation

  // Keep refs in sync with props/state (no cost — just assignments)
  useEffect(()=>{ toolRef.current=tool; },[tool]);
  useEffect(()=>{ freeCropRef.current=freeCrop; },[freeCrop]);
  useEffect(()=>{ blurCfgRef.current=blurCfg; },[blurCfg]);
  useEffect(()=>{ eraserCfgRef.current=eraserCfg; },[eraserCfg]);
  useEffect(()=>{ annotateCfgRef.current=annotateCfg; },[annotateCfg]);
  useEffect(()=>{ settingsRef2.current=settings; },[settings]);
  useEffect(()=>{ fileRef.current=file; },[file]); // keeps fileRef current without recreating drawNow
  
  // Redraw when border settings change
  useEffect(()=>{
    draw();
  }, [settings.borderW, settings.borderColor, draw]);

  // Fires synchronously BEFORE browser paint → no blank-frame window.
  // Calls drawNow() directly (not draw/RAF) so canvas is updated in the same commit frame.
  // Guard: skip cropRef overwrite while a drag is live.
  const { useLayoutEffect } = React;
  useLayoutEffect(()=>{
    if(!isDraggingRef.current) cropRef.current=file.crop;
    drawNow(); // synchronous — the RAF gap was the root cause of the flicker
  },[file.crop, drawNow]); // drawNow is stable ([] deps) → effectively just [file.crop]

  const st = useRef({mode:"none",isPan:false,panStart:null,panOrig:null,
                     cropOrig:null,cropStart:null,moveStartImg:null,handleIdx:-1,blurPushed:false});

  // ── Imperative draw — called directly, no React state ──────────────────
  const drawNow = useCallback(()=>{
    const c=canvasRef.current; if(!c||!c.width) return;
    const ctx=c.getContext("2d");
    const W=c.width, H=c.height;
    const z=zoomRef.current, p=panRef.current;
    const img=fileRef.current.ec, iW=img.width, iH=img.height; // fileRef: no recreations on file changes
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality="medium";
    ctx.fillStyle="#181818"; ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2+p.x, H/2+p.y); ctx.scale(z,z); ctx.translate(-iW/2,-iH/2);
    ctx.drawImage(img,0,0);
    
    // Draw border preview if enabled
    const borderW = settingsRef2.current.borderW || 0;
    const borderColor = settingsRef2.current.borderColor || "#ffffff";
    const cr=cropRef.current;
    
    if(borderW > 0 && cr && cr.w > 2) {
      // Draw border around crop area
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = borderW;
      ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
    }
    
    if(cr&&cr.w>2) drawCropShadow(ctx,cr,1,0,0,iW,iH);
    ctx.restore();
    ctx.font="500 11px Inter,sans-serif"; ctx.fillStyle="rgba(150,150,150,0.5)";
    const sc = cr&&cr.w>2 ? `   ✂ ${Math.round(cr.w)}×${Math.round(cr.h)}` : "";
    ctx.fillText(`${iW}×${iH}px   ${Math.round(z*100)}%${sc}`,12,H-12);
  },[]); // stable — reads everything via refs, never needs to recreate
  const draw = useCallback(()=>{
    if(frameRef.current) return;
    frameRef.current = requestAnimationFrame(()=>{
      frameRef.current = 0;
      drawNow();
    });
  },[drawNow]);

  // ── Coordinate helpers — pure, use refs ────────────────────────────────
  const getPointerData=(sx,sy)=>{
    const c=canvasRef.current; if(!c) return null;
    const r=c.getBoundingClientRect();
    const z=zoomRef.current, p=panRef.current;
    const iW=file.ec.width, iH=file.ec.height;
    const px=(sx-r.left)*(c.width/r.width), py=(sy-r.top)*(c.height/r.height);
    return{
      img:{x:(sx-r.left-c.width/2-p.x)/z+iW/2, y:(sy-r.top-c.height/2-p.y)/z+iH/2},
      px, py, sc:z,
      offX:(c.width/2+p.x)-iW*z/2,
      offY:(c.height/2+p.y)-iH*z/2,
    };
  };
  const clampPan=(px,py,z)=>{
    const cont=contRef.current; if(!cont) return{x:px,y:py};
    const cW=cont.clientWidth, cH=cont.clientHeight, iW=file.ec.width, iH=file.ec.height;
    const ex=Math.max(0,iW*z-cW)/2, ey=Math.max(0,iH*z-cH)/2;
    return{x:Math.max(-ex,Math.min(ex,px)), y:Math.max(-ey,Math.min(ey,py))};
  };
  const getRatio=()=> freeCropRef.current ? null : settingsRef2.current.w/settingsRef2.current.h;

  // ── Setup: fitView + ResizeObserver ────────────────────────────────────
  const fitView=useCallback(()=>{
    if(isDraggingRef.current) return;
    const cont=contRef.current, c=canvasRef.current; if(!cont||!c) return;
    const cW=cont.clientWidth, cH=cont.clientHeight;
    if(cW===0||cH===0) return;
    const ec=fileRef.current.ec;
    // Only reassign canvas dimensions when they actually changed:
    // assigning canvas.width/height ALWAYS clears the canvas (even same value) → blank frame
    const sizeChanged=(c.width!==cW||c.height!==cH);
    if(sizeChanged){ c.width=cW; c.height=cH; }
    const fz=Math.min(cW/ec.width, cH/ec.height)*0.92;
    fitZRef.current=fz;
    if(sizeChanged||zoomRef.current<fz){ zoomRef.current=fz; panRef.current={x:0,y:0}; }
    drawNow(); // synchronous — canvas is redrawn immediately, no blank-frame RAF gap
    setReady(true);
  },[drawNow]); // drawNow is stable ([] deps) → fitView is stable → ResizeObserver registers once

  useEffect(()=>{
    // Small timeout so the flex container has its final size
    const id=setTimeout(fitView,30);
    return()=>clearTimeout(id);
  },[]);

  useEffect(()=>{
    const cont=contRef.current, c=canvasRef.current; if(!cont||!c) return;
    const ro=new ResizeObserver(()=>{ fitView(); });
    ro.observe(cont);
    return()=>ro.disconnect();
  },[fitView]);
  useEffect(()=>()=>{ if(frameRef.current) cancelAnimationFrame(frameRef.current); },[]);

  // ── Blur helper ────────────────────────────────────────────────────────
  const doBlur=(ix,iy)=>{
    const{size,strength,hardness,opacity}=blurCfgRef.current;
    const ec=file.ec, ctx=ec.getContext("2d");
    const r=size/2, bx=Math.round(ix-r), by=Math.round(iy-r);
    if(bx+size<0||by+size<0||bx>ec.width||by>ec.height) return;
    const tmp=document.createElement("canvas"); tmp.width=size; tmp.height=size;
    const tc=tmp.getContext("2d");
    tc.filter=`blur(${strength}px)`; tc.drawImage(ec,bx,by,size,size,0,0,size,size); tc.filter="none";
    const g=tc.createRadialGradient(r,r,r*(hardness/100),r,r,r);
    g.addColorStop(0,`rgba(0,0,0,${opacity/100})`); g.addColorStop(1,"rgba(0,0,0,0)");
    tc.globalCompositeOperation="destination-in"; tc.fillStyle=g; tc.fillRect(0,0,size,size);
    ctx.drawImage(tmp,bx,by);
    draw(); // direct draw, no setState
  };

  // ── Pixelate helper ──────────────────────────────────────────────────
  const doPixelate=(ix,iy)=>{
    const{size,pixelSize=8,hardness,opacity}=blurCfgRef.current;
    const ec=file.ec, ctx=ec.getContext("2d");
    const r=size/2, bx=Math.round(ix-r), by=Math.round(iy-r);
    if(bx+size<0||by+size<0||bx>ec.width||by>ec.height) return;
    const ps=Math.max(2,pixelSize);
    const tmp=document.createElement("canvas"); tmp.width=size; tmp.height=size;
    const tc=tmp.getContext("2d");
    // downscale then upscale for pixelation
    const sm=document.createElement("canvas");
    const sw=Math.max(1,Math.round(size/ps)), sh=Math.max(1,Math.round(size/ps));
    sm.width=sw; sm.height=sh;
    const sc=sm.getContext("2d"); sc.imageSmoothingEnabled=true;
    sc.drawImage(ec,bx,by,size,size,0,0,sw,sh);
    tc.imageSmoothingEnabled=false;
    tc.drawImage(sm,0,0,sw,sh,0,0,size,size);
    // radial mask
    const g=tc.createRadialGradient(r,r,r*(hardness/100),r,r,r);
    g.addColorStop(0,`rgba(0,0,0,${opacity/100})`); g.addColorStop(1,"rgba(0,0,0,0)");
    tc.globalCompositeOperation="destination-in"; tc.fillStyle=g; tc.fillRect(0,0,size,size);
    ctx.drawImage(tmp,bx,by);
    draw();
  };

  // ── NUEVO: Eraser helper ────────────────────────────────────────────────
  const doEraser=(ix,iy)=>{
    const{size,mode,color,opacity,hardness=50}=eraserCfgRef.current;
    const ec=file.ec, ctx=ec.getContext("2d");
    const r = size/2;
    
    if(mode === "transparent"){
      // Borrar a transparencia con hardness
      const tmp=document.createElement("canvas"); tmp.width=size; tmp.height=size;
      const tc=tmp.getContext("2d");
      tc.fillStyle = "rgba(0,0,0,1)";
      tc.beginPath();
      tc.arc(r, r, r, 0, Math.PI*2);
      tc.fill();
      
      // Aplicar gradient de hardness
      const g=tc.createRadialGradient(r,r,r*(hardness/100),r,r,r);
      g.addColorStop(0,`rgba(0,0,0,${opacity/100})`);
      g.addColorStop(1,"rgba(0,0,0,0)");
      tc.globalCompositeOperation="destination-in";
      tc.fillStyle=g;
      tc.fillRect(0,0,size,size);
      
      ctx.globalCompositeOperation = "destination-out";
      ctx.drawImage(tmp, Math.round(ix-r), Math.round(iy-r));
      ctx.globalCompositeOperation = "source-over";
      
    } else if(mode === "solid"){
      // Rellenar con color sólido con hardness
      const tmp=document.createElement("canvas"); tmp.width=size; tmp.height=size;
      const tc=tmp.getContext("2d");
      tc.fillStyle = color;
      tc.beginPath();
      tc.arc(r, r, r, 0, Math.PI*2);
      tc.fill();
      
      // Aplicar gradient de hardness
      const g=tc.createRadialGradient(r,r,r*(hardness/100),r,r,r);
      g.addColorStop(0,`rgba(0,0,0,${opacity/100})`);
      g.addColorStop(1,"rgba(0,0,0,0)");
      tc.globalCompositeOperation="destination-in";
      tc.fillStyle=g;
      tc.fillRect(0,0,size,size);
      
      ctx.drawImage(tmp, Math.round(ix-r), Math.round(iy-r));
      
    } else if(mode === "smart"){
      // Smart fill FINAL: Pure Gaussian Blur
      // SIN proyección radial, SIN ángulos → SIN efecto espiral
      const bx=Math.round(ix-r), by=Math.round(iy-r);
      if(bx+size<0||by+size<0||bx>ec.width||by>ec.height) return;
      
      // Capturar área expandida (2.5x para tener contexto)
      const expandSize = size * 2.5;
      const expandR = expandSize / 2;
      const expandBx = Math.round(ix - expandR);
      const expandBy = Math.round(iy - expandR);
      
      const expandCanvas = document.createElement("canvas");
      expandCanvas.width = expandSize;
      expandCanvas.height = expandSize;
      const ectx = expandCanvas.getContext("2d");
      
      // Dibujar área expandida
      ectx.drawImage(ec, expandBx, expandBy, expandSize, expandSize, 0, 0, expandSize, expandSize);
      
      // Aplicar blur gaussiano nativo del navegador
      const blurAmount = Math.max(8, Math.min(20, r/3));
      ectx.filter = `blur(${blurAmount}px)`;
      ectx.drawImage(expandCanvas, 0, 0);
      ectx.filter = "none";
      
      // Extraer solo la parte central (área del pincel)
      const tmp = document.createElement("canvas");
      tmp.width = size;
      tmp.height = size;
      const tc = tmp.getContext("2d");
      
      // Copiar desde el centro del área blurred
      const offsetX = expandR - r;
      const offsetY = expandR - r;
      tc.drawImage(expandCanvas, offsetX, offsetY, size, size, 0, 0, size, size);
      
      // Aplicar máscara circular con hardness
      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = size;
      maskCanvas.height = size;
      const mc = maskCanvas.getContext("2d");
      
      const g = mc.createRadialGradient(r,r,r*(hardness/100),r,r,r);
      g.addColorStop(0,`rgba(0,0,0,${opacity/100})`);
      g.addColorStop(1,"rgba(0,0,0,0)");
      mc.fillStyle = g;
      mc.fillRect(0,0,size,size);
      
      tc.globalCompositeOperation = "destination-in";
      tc.drawImage(maskCanvas, 0, 0);
      tc.globalCompositeOperation = "source-over";
      
      ctx.drawImage(tmp,bx,by);
    }
    
    ctx.globalAlpha = 1;
    draw();
  };

  // ── NUEVO: Annotate helper ──────────────────────────────────────────────
  const doAnnotate=(ix,iy)=>{
    const{mode,color,thickness,opacity,hardness=70}=annotateCfgRef.current;
    const ec=file.ec, ctx=ec.getContext("2d");
    const s=st.current;
    
    if(mode === "draw"){
      // Modo dibujo con hardness
      if(s.lastX !== undefined && s.lastY !== undefined){
        // Dibujar línea con hardness usando múltiples segmentos
        const dx = ix - s.lastX;
        const dy = iy - s.lastY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const steps = Math.max(1, Math.floor(dist / 2));
        
        for(let i=0; i<=steps; i++){
          const t = i / steps;
          const x = s.lastX + dx * t;
          const y = s.lastY + dy * t;
          
          // Crear canvas temporal para hardness
          const size = thickness * 2.5;
          const tmp=document.createElement("canvas");
          tmp.width=size; tmp.height=size;
          const tc=tmp.getContext("2d");
          
          const r = thickness / 2;
          tc.fillStyle = color;
          tc.beginPath();
          tc.arc(size/2, size/2, r, 0, Math.PI*2);
          tc.fill();
          
          // Aplicar gradient de hardness
          const g=tc.createRadialGradient(size/2,size/2,r*(hardness/100),size/2,size/2,r);
          g.addColorStop(0,`rgba(0,0,0,${opacity/100})`);
          g.addColorStop(1,"rgba(0,0,0,0)");
          tc.globalCompositeOperation="destination-in";
          tc.fillStyle=g;
          tc.fillRect(0,0,size,size);
          
          ctx.drawImage(tmp, Math.round(x-size/2), Math.round(y-size/2));
        }
      } else {
        // Primer punto: dibujar círculo
        const size = thickness * 2.5;
        const tmp=document.createElement("canvas");
        tmp.width=size; tmp.height=size;
        const tc=tmp.getContext("2d");
        
        const r = thickness / 2;
        tc.fillStyle = color;
        tc.beginPath();
        tc.arc(size/2, size/2, r, 0, Math.PI*2);
        tc.fill();
        
        const g=tc.createRadialGradient(size/2,size/2,r*(hardness/100),size/2,size/2,r);
        g.addColorStop(0,`rgba(0,0,0,${opacity/100})`);
        g.addColorStop(1,"rgba(0,0,0,0)");
        tc.globalCompositeOperation="destination-in";
        tc.fillStyle=g;
        tc.fillRect(0,0,size,size);
        
        ctx.drawImage(tmp, Math.round(ix-size/2), Math.round(iy-size/2));
      }
      
      s.lastX = ix;
      s.lastY = iy;
    }
    // Modo text se maneja en onMouseDown (click para colocar texto)
    
    draw();
  };

  // Helper para renderizar texto correctamente (evitar inversión)
  const renderTextToCanvas = (text, x, y) => {
    if(!text || !text.trim()) return;
    const ctx = file.ec.getContext("2d");
    ctx.save();
    ctx.font = `${annotateCfg.fontSize}px ${annotateCfg.font}`;
    ctx.fillStyle = annotateCfg.color;
    ctx.globalAlpha = annotateCfg.opacity / 100;
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.direction = "ltr";
    ctx.fillText(text.trim(), x, y);
    ctx.restore();
    draw();
  };

  // ── Mouse handlers — all imperative, zero setState ─────────────────────
  const onMouseDown=useCallback((e)=>{
    isDraggingRef.current = true;
    const s=st.current;
    if(e.button===2||e.altKey){
      e.preventDefault(); s.isPan=true;
      s.panStart={x:e.clientX,y:e.clientY}; s.panOrig={...panRef.current}; return;
    }
    if(e.button!==0) return;
    if(toolRef.current==="crop"){
      const pd=getPointerData(e.clientX,e.clientY); if(!pd) return;
      const p=pd.img;
      const cr=cropRef.current;
      const hi=cr&&cr.w>2?hitHandle(pd.px,pd.py,cr,pd.sc,pd.offX,pd.offY):-1;
      if(hi>=0){
        onUndoPush(file.id); s.mode="handle"; s.handleIdx=hi; s.cropOrig={...cr}; s.cropStart=p;
      } else if(cr&&cr.w>2&&p.x>=cr.x&&p.x<=cr.x+cr.w&&p.y>=cr.y&&p.y<=cr.y+cr.h){
        onUndoPush(file.id); s.mode="move"; s.cropOrig={...cr}; s.moveStartImg=p;
      } else if(p.x>=0&&p.x<=file.ec.width&&p.y>=0&&p.y<=file.ec.height){
        onUndoPush(file.id); s.mode="new"; s.cropStart=p;
        cropRef.current={x:p.x,y:p.y,w:0,h:0}; draw();
      }
    }
    if(toolRef.current==="blur"||toolRef.current==="pixelate"||toolRef.current==="eraser"||toolRef.current==="annotate"){
      if(!s.blurPushed){onUndoPush(file.id);s.blurPushed=true;}
      s.mode=toolRef.current; const pd=getPointerData(e.clientX,e.clientY);
      if(pd){ 
        if(toolRef.current==="blur") doBlur(pd.img.x,pd.img.y); 
        else if(toolRef.current==="pixelate") doPixelate(pd.img.x,pd.img.y);
        else if(toolRef.current==="eraser") doEraser(pd.img.x,pd.img.y);
        else if(toolRef.current==="annotate") {
          const cfg = annotateCfgRef.current;
          if(cfg.mode === "text"){
            // Modo texto: crear editor interactivo
            setActiveText({
              x: pd.px,  // Posición en canvas pixels
              y: pd.py,
              imgX: pd.img.x,  // Posición en imagen
              imgY: pd.img.y,
              text: "",
              editing: true
            });
          } else {
            // Modo draw: iniciar trazo
            s.lastX=pd.img.x; s.lastY=pd.img.y;
          }
        }
      }
    }
  },[file,onUndoPush,draw]);

  const onMouseMove=useCallback((e)=>{
    const s=st.current;
    const ratio=getRatio();
    const iW=file.ec.width, iH=file.ec.height;

    if(s.isPan){
      const np=clampPan(s.panOrig.x+e.clientX-s.panStart.x, s.panOrig.y+e.clientY-s.panStart.y, zoomRef.current);
      panRef.current=np; draw();
      if(toolRef.current==="blur"||toolRef.current==="pixelate"){
        const cont=contRef.current, circle=blurCircleRef.current;
        if(cont&&circle){const r=cont.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const sz=blurCfgRef.current.size*zoomRef.current;circle.style.cssText=`display:block;left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px`;}
      }
      return;
    }

    const pd=getPointerData(e.clientX,e.clientY); if(!pd) return;
    const p=pd.img;
    let newCrop=null;

    if(s.mode==="new"&&s.cropStart){
      const rawW=p.x-s.cropStart.x, rawH=p.y-s.cropStart.y;
      let cW=Math.abs(rawW), cH=Math.abs(rawH);
      if(ratio){ if(cW/(cH||0.001)>ratio) cH=cW/ratio; else cW=cH*ratio; }
      const nx=rawW>=0?s.cropStart.x:s.cropStart.x-cW;
      const ny=rawH>=0?s.cropStart.y:s.cropStart.y-cH;
      newCrop=clampCrop({x:nx,y:ny,w:cW,h:cH},iW,iH,ratio);
    } else if(s.mode==="move"&&s.cropOrig){
      const dx=p.x-s.moveStartImg.x, dy=p.y-s.moveStartImg.y;
      newCrop=clampCrop({...s.cropOrig,x:s.cropOrig.x+dx,y:s.cropOrig.y+dy},iW,iH,ratio);
    } else if(s.mode==="handle"&&s.cropOrig){
      const orig=s.cropOrig, hi=s.handleIdx, sp=s.cropStart;
      const dx=p.x-sp.x, dy=p.y-sp.y;
      let {x,y,w,h}={...orig};
      const{hx,hy}=HANDLES[hi];
      // Anchor-aware resize: keep opposite edge fixed, pre-clamp to image boundaries
      if(hx===0){ const r=orig.x+orig.w; x=Math.max(0,Math.min(orig.x+dx,r-10)); w=r-x; }
      if(hx===1){ w=Math.max(10,Math.min(orig.w+dx,iW-orig.x)); x=orig.x; }
      if(hy===0){ const b=orig.y+orig.h; y=Math.max(0,Math.min(orig.y+dy,b-10)); h=b-y; }
      if(hy===1){ h=Math.max(10,Math.min(orig.h+dy,iH-orig.y)); y=orig.y; }
      // Ratio enforcement (only if lock is active)
      if(ratio){
        if(hx===0.5){w=h*ratio;x=orig.x+(orig.w-w)/2;}
        else if(hy===0.5){h=w/ratio;y=orig.y+(orig.h-h)/2;}
        else{if(Math.abs(dx)>=Math.abs(dy))h=w/ratio; else w=h*ratio; if(hx===0)x=orig.x+orig.w-w; if(hy===0)y=orig.y+orig.h-h;}
      }
      newCrop=clampCrop({x,y,w,h},iW,iH,ratio); // pass ratio so clampCrop maintains it after edge clamping
    } else if(s.mode==="blur"){
      doBlur(p.x,p.y);
    } else if(s.mode==="pixelate"){
      doPixelate(p.x,p.y);
    } else if(s.mode==="eraser"){
      doEraser(p.x,p.y);
    } else if(s.mode==="annotate"){
      doAnnotate(p.x,p.y);
    }

    if(newCrop){ cropRef.current=newCrop; draw(); }

    // Cursor — direct DOM, no setState
    if(toolRef.current==="crop"){
      const cr=cropRef.current;
      const hi2=cr&&cr.w>2?hitHandle(pd.px,pd.py,cr,pd.sc,pd.offX,pd.offY):-1;
      const cv=canvasRef.current; if(cv) cv.style.cursor=hi2>=0?HANDLES[hi2].cx:(cr&&cr.w>2&&p.x>=cr.x&&p.x<=cr.x+cr.w&&p.y>=cr.y&&p.y<=cr.y+cr.h?"move":"crosshair");
    }
    if(toolRef.current==="blur"||toolRef.current==="pixelate"||toolRef.current==="eraser"||toolRef.current==="annotate"){
      const cont=contRef.current, circle=blurCircleRef.current;
      if(cont&&circle){
        const r=cont.getBoundingClientRect();
        const x=e.clientX-r.left,y=e.clientY-r.top;
        const cfg = toolRef.current==="eraser" ? eraserCfgRef.current : 
                    toolRef.current==="annotate" ? annotateCfgRef.current :
                    blurCfgRef.current;
        
        // Para annotate, mostrar el tamaño real del pincel con hardness
        let sz, borderColor, bgGradient;
        if(toolRef.current==="annotate" && cfg.mode==="draw"){
          sz = cfg.thickness * 2.5; // Tamaño real del pincel
          borderColor = cfg.color;
          // Crear gradiente radial que muestra el hardness
          const hardnessRadius = (cfg.hardness || 70) / 100;
          bgGradient = `radial-gradient(circle, ${cfg.color}${Math.round(cfg.opacity*2.55).toString(16).padStart(2,'0')} ${hardnessRadius*50}%, transparent ${hardnessRadius*100}%)`;
        } else if(toolRef.current==="annotate" && cfg.mode==="text"){
          sz = cfg.fontSize * 0.7; // Aproximación del tamaño de texto
          borderColor = cfg.color;
          bgGradient = `radial-gradient(circle, ${cfg.color}20 0%, transparent 70%)`;
        } else if(toolRef.current==="eraser"){
          sz = cfg.size;
          borderColor = "rgba(255,255,255,0.75)";
          if(cfg.mode==="transparent"){
            bgGradient = "radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%)";
          } else if(cfg.mode==="solid"){
            const hardnessRadius = (cfg.hardness || 50) / 100;
            bgGradient = `radial-gradient(circle, ${cfg.color}${Math.round(cfg.opacity*2.55).toString(16).padStart(2,'0')} ${hardnessRadius*50}%, transparent ${hardnessRadius*100}%)`;
          } else {
            bgGradient = "radial-gradient(circle, rgba(124,92,255,0.2) 0%, transparent 70%)";
          }
        } else {
          sz = cfg.size;
          borderColor = "rgba(255,255,255,0.75)";
          bgGradient = "transparent";
        }
        
        const scaledSz = sz * zoomRef.current;
        
        circle.style.cssText=`display:block;position:absolute;border-radius:50%;border:2px solid ${borderColor};box-shadow:0 0 0 1px rgba(0,0,0,0.5);pointer-events:none;box-sizing:border-box;left:${x-scaledSz/2}px;top:${y-scaledSz/2}px;width:${scaledSz}px;height:${scaledSz}px;background:${bgGradient}`;
      }
    }
  },[file,draw]);

  const commitCrop=()=>{
    const s=st.current;
    if(s.mode==="new"||s.mode==="move"||s.mode==="handle") onCropChange(file.id,cropRef.current);
    s.mode="none"; s.isPan=false; s.blurPushed=false; s.handleIdx=-1;
    s.lastX=undefined; s.lastY=undefined; // Reset para annotate
    isDraggingRef.current = false;
  };
  const onMouseUp   =useCallback(()=>{ commitCrop(); },[file,onCropChange]);
  const onMouseLeave=useCallback(()=>{ commitCrop(); if(blurCircleRef.current) blurCircleRef.current.style.display="none"; },[file,onCropChange]);

  const onWheel=useCallback((e)=>{
    e.preventDefault();
    const minZ=fitZRef.current;
    let nz=Math.max(minZ,Math.min(40,zoomRef.current*(e.deltaY<0?1.13:0.88)));
    if(nz<=minZ){ nz=minZ; panRef.current={x:0,y:0}; }
    else{ panRef.current=clampPan(panRef.current.x,panRef.current.y,nz); }
    zoomRef.current=nz; draw();
  },[draw]);

  // Wheel must be attached imperatively — React's onWheel is passive and can't preventDefault
  useEffect(()=>{
    const c=canvasRef.current; if(!c) return;
    c.addEventListener("wheel",onWheel,{passive:false});
    return()=>c.removeEventListener("wheel",onWheel);
  },[onWheel]);

  const autoCrop=()=>{
    onUndoPush(file.id);
    const {w:oW,h:oH,focalPoint}=settingsRef2.current;
    const {ax,ay}=focalPoint||{ax:0.5,ay:0.5};
    const nc=focalCrop(file.ec.width,file.ec.height,oW,oH,ax,ay);
    cropRef.current=nc; onCropChange(file.id,nc); draw();
  };

  const smartAutoCrop=async()=>{
    setSmartCropping(true);
    onUndoPush(file.id);
    const {w:oW,h:oH,focalPoint}=settingsRef2.current;
    let nc=await runSmartCrop(file.ec,oW,oH);
    if(!nc||nc.w<2||nc.h<2){
      const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
      nc=focalCrop(file.ec.width,file.ec.height,oW,oH,ax,ay);
      showToast(t?.toastSmartCropErr||"Smart crop failed, using focal point crop");
    }
    cropRef.current=nc; onCropChange(file.id,nc); draw();
    setSmartCropping(false);
  };
  const clearCrop=()=>{
    onUndoPush(file.id);
    const {w:oW,h:oH,focalPoint}=settingsRef2.current;
    const {ax,ay}=focalPoint||{ax:0.5,ay:0.5};
    const nc={...focalCrop(file.ec.width,file.ec.height,oW,oH,ax,ay),auto:true};
    cropRef.current=nc; onCropChange(file.id,nc); draw();
  };

  const {w:oW,h:oH}=settings, dv=gcd(oW,oH);
  const ratioLbl=`${oW/dv}:${oH/dv}`;
  const oBtnSt=(active)=>({fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:active?600:400,border:"none",borderRadius:4,padding:"5px 10px",cursor:"pointer",background:active?"#7c5cff":"transparent",color:active?"#fff":"#555",display:"inline-flex",alignItems:"center",gap:5,transition:"all .12s"});
  const oTxtBtn=(label,onClick)=>(
    <button onClick={onClick} style={{fontFamily:"Inter,sans-serif",fontSize:11,border:"none",background:"transparent",color:"#505050",cursor:"pointer",padding:"5px 8px",borderRadius:4}}>{label}</button>
  );

  const PANEL_W = panelOpen ? 360 : 0;
  return (
    <div style={{position:"fixed",top:50,left:0,right:PANEL_W,bottom:0,background:"#181818",display:"flex",flexDirection:"column",zIndex:200}}
      onContextMenu={e=>e.preventDefault()}>

      {/* ── Top bar: back + file name ── */}
      <div style={{background:"#141414",borderBottom:"1px solid #242424",padding:"5px 12px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
        <button onClick={onClose} style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:600,border:"1px solid #303030",borderRadius:5,padding:"5px 10px",cursor:"pointer",background:"transparent",color:"#d0d0d0"}}>{t?.back||"← Back"}</button>
        <div style={{width:1,height:16,background:"#282828"}}/>
        {tool==="crop"&&(
          <button onClick={()=>setFreeCrop(f=>!f)}
            style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:700,borderRadius:3,padding:"3px 9px",cursor:"pointer",border:"none",
              background:freeCrop?"rgba(245,158,11,0.15)":"rgba(124,92,255,0.15)",
              color:freeCrop?"#f59e0b":"#a78bfa"}}>
            {freeCrop?(t?.freeCrop||"🔓 Libre"):(t?.lockedCrop?.(ratioLbl)||`🔒 ${ratioLbl}`)}
          </button>
        )}
        <div style={{flex:1}}/>
        <span style={{fontSize:10,color:"#383838",fontFamily:"Inter,sans-serif",fontStyle:"italic"}}>{t?.rightClickHint||"Clic derecho = mover"}</span>
        <div style={{width:1,height:16,background:"#282828"}}/>
        <span style={{fontSize:11,color:"#383838",fontFamily:"Inter,sans-serif",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{file.name}</span>
      </div>

      {/* ── Main area: leftToolbar + canvas ── */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* Left toolbar — tool selector with flyout for brush settings */}
        <div style={{width:44,background:"#141414",borderRight:"1px solid #1e1e1e",display:"flex",flexDirection:"column",alignItems:"center",paddingTop:10,gap:2,flexShrink:0,position:"relative",zIndex:20}}>
          {[
            {id:"crop",tip:t?.cropTool||"Crop"},
            {id:"blur",tip:t?.blurTool||"Blur"},
            {id:"pixelate",tip:t?.pixelateTool||"Pixelate"},
            {id:"eraser",tip:t?.blurTool ? "Borrador" : "Eraser"},
            {id:"annotate",tip:t?.blurTool ? "Anotar" : "Annotate"}
          ].map(tb=>(
            <button key={tb.id} onClick={()=>setTool(tb.id)}
              title={tb.tip}
              style={{width:34,height:34,border:"none",borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .12s",
                background:tool===tb.id?"rgba(124,92,255,0.18)":"transparent",
                color:tool===tb.id?"#a78bfa":"#555"}}>
              <ToolIcon type={tb.id} size={17} color={tool===tb.id?"#a78bfa":"#555"}/>
            </button>
          ))}

          {/* Flyout brush settings panel */}
          {(tool==="blur"||tool==="pixelate")&&(
            <div style={{position:"absolute",left:44,top:0,width:200,background:"#1a1a1a",borderRight:"1px solid #242424",borderBottom:"1px solid #242424",padding:"12px 12px 8px",display:"flex",flexDirection:"column",gap:2,zIndex:30,boxShadow:"4px 0 16px rgba(0,0,0,0.3)"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}}>
                {tool==="blur"?(t.secBlur):(t.pixelateTool)}
              </div>
              <label style={{fontSize:10,color:"#666",marginBottom:2}}>{t.sizeLbl(blurCfg.size)}</label>
              <input type="range" min={5} max={500} value={blurCfg.size}
                onChange={e=>onBlurCfgChange(b=>({...b,size:+e.target.value}))} style={{marginBottom:6}}/>
              {tool==="blur"&&<>

    }
    let c=file.crop;
    if(!c||c.w<2){const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};c=focalCrop(src.width,src.height,w,h,ax,ay);}
    const sx=Math.max(0,c.x),sy=Math.max(0,c.y),sw=Math.min(c.w,src.width-sx),sh=Math.min(c.h,src.height-sy);
    const bw=borderW||0, totalW=w+bw*2, totalH=h+bw*2;
    const out=document.createElement("canvas"); out.width=totalW; out.height=totalH;
    const ctx=out.getContext("2d");
    if(bw>0){ctx.fillStyle=borderColor||"#000";ctx.fillRect(0,0,totalW,totalH);}
    ctx.fillStyle="#fff"; ctx.fillRect(bw,bw,w,h);
    const sc=Math.min(w/sw,h/sh),dw=sw*sc,dh=sh*sc;
    ctx.drawImage(src,sx,sy,sw,sh,bw+(w-dw)/2,bw+(h-dh)/2,dw,dh);
    if(wmText&&wmText.trim()){
      ctx.save(); ctx.globalAlpha=(wmOpacity||80)/100; ctx.fillStyle=wmColor||"#fff";
      ctx.font=`${wmSize||24}px ${wmFont||"Inter"},sans-serif`; ctx.textBaseline="middle";
      const pad=Math.max(12,Math.round(totalW*0.02)); let tx,ty;
      if(wmPos==="tl"){ctx.textAlign="left";tx=bw+pad;ty=bw+pad+wmSize/2;}
      else if(wmPos==="tr"){ctx.textAlign="right";tx=totalW-bw-pad;ty=bw+pad+wmSize/2;}
      else if(wmPos==="bl"){ctx.textAlign="left";tx=bw+pad;ty=totalH-bw-pad-wmSize/2;}
      else if(wmPos==="center"){ctx.textAlign="center";tx=totalW/2;ty=totalH/2;}
      else{ctx.textAlign="right";tx=totalW-bw-pad;ty=totalH-bw-pad-wmSize/2;}
      ctx.fillText(wmText,tx,ty); ctx.restore();
    }
    const mime=fmt==="jpeg"?"image/jpeg":fmt==="png"?"image/png":fmt==="avif"?"image/avif":"image/webp";
    setDims({tw:totalW,th:totalH});
    setDataUrl(out.toDataURL(mime,quality/100));
  },[]);

  const{fmt,quality}=settings;
  return (
    <div id="preview-modal" onClick={onClose}>
      <div className="pm-box" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontFamily:"Inter",fontWeight:600,fontSize:13,color:"#d0d0d0"}}>{t.previewTitle} · {dims.tw}×{dims.th}px · {fmt.toUpperCase()}{fmt!=="png"?` · ${quality}%`:""}</span>
          <button onClick={onClose} style={{fontFamily:"Inter",fontSize:12,background:"transparent",border:"1px solid #303030",borderRadius:5,color:"#aaa",padding:"4px 12px",cursor:"pointer"}}>{t.previewClose}</button>
        </div>
        {dataUrl?<img src={dataUrl} alt="preview"/>:<div style={{color:"#555",padding:40}}>Loading…</div>}
        <div style={{fontSize:10,color:"#555",fontFamily:"Inter"}}>{file.name}</div>
      </div>
    </div>
  );
}
