  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; background: #181818; }
    body { font-family: 'Inter', sans-serif; color: #d0d0d0; }

    input[type=range] { -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px; background: #2e2e2e; outline: none; cursor: pointer; width: 100%; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #7c5cff; cursor: pointer; box-shadow: 0 0 0 2px rgba(124,92,255,0.25); margin-top: -5px; }
    input[type=number] { background: #222; border: 1px solid #303030; border-radius: 5px; color: #d0d0d0; font-family: Inter,sans-serif; font-size: 12px; padding: 6px 8px; outline: none; width: 100%; margin-bottom: 8px; }

    input[type=number]::-webkit-outer-spin-button { 
      opacity: 1;
      cursor: pointer;
      background: #2a2a2a;
      border-left: 1px solid #383838;
      margin-left: 4px;
    }
    input[type=number]::-webkit-inner-spin-button:hover,
    input[type=number]::-webkit-outer-spin-button:hover {
      background: #333;
    }
    input[type=text] { background: #222; border: 1px solid #303030; border-radius: 5px; color: #d0d0d0; font-family: Inter,sans-serif; font-size: 12px; padding: 6px 8px; outline: none; width: 100%; margin-bottom: 8px; }
    input[type=color] { -webkit-appearance: none; appearance: none; border: none; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
    input[type=color]::-moz-color-swatch { border: none; border-radius: 3px; }
    select { background: #222; border: 1px solid #303030; border-radius: 5px; color: #d0d0d0; font-family: Inter,sans-serif; font-size: 12px; padding: 6px 8px; outline: none; width: 100%; margin-bottom: 8px; cursor: pointer; }
    /* Scrollbar - Chrome/Safari/Edge */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    
    /* Scrollbar - Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #2e2e2e transparent;
    }

    /* Cell */
    .cell-wrap { position: relative; background: #202020; border-radius: 8px; overflow: hidden; border: 2px solid #282828; transition: border-color .15s; cursor: crosshair; break-inside: avoid; }
    .cell-wrap:hover { border-color: #383838; }
    .cell-wrap.selected { border-color: #7c5cff; box-shadow: 0 0 0 1px #7c5cff; }
    .cell-wrap.multi-sel { border-color: #a78bfa; }
    .cell-wrap.drag-over { border-color: #7c5cff; opacity: 0.6; }
    .cell-wrap .hover-btns { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 2; }
    .cell-wrap:hover .hover-btns { opacity: 1; pointer-events: all; }
    .hbtn { font-family: Inter,sans-serif; font-size: 11px; font-weight: 600; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    .hbtn-edit  { background: #7c5cff; color: #fff; }
    .hbtn-edit:hover  { background: #9b80ff; }
    .hbtn-prev  { background: rgba(34,197,94,0.2); color: #4ade80; }
    .hbtn-prev:hover  { background: rgba(34,197,94,0.35); }
    .hbtn-del   { background: rgba(239,68,68,0.2); color: #f87171; }
    .hbtn-del:hover   { background: rgba(239,68,68,0.35); }

    /* Toast */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #d0d0d0; color: #111; font-size: 12px; font-family: Inter,sans-serif; padding: 8px 20px; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 9999; white-space: nowrap; font-weight: 500; }
    #toast.show { opacity: 1; }

    /* Drop overlay */
    #drop-overlay { position: fixed; inset: 0; background: rgba(24,24,24,0.93); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 8888; pointer-events: none; opacity: 0; transition: opacity .18s; }
    #drop-overlay.show { opacity: 1; pointer-events: all; }
    #drop-overlay .box { border: 2px dashed #383838; border-radius: 16px; padding: 52px 80px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    #drop-overlay .label { font-size: 20px; font-weight: 600; color: #d0d0d0; }

    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: transparent; }
    input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: #2e2e2e; }
    input[type=range]::-moz-range-progress { background: #7c5cff; height: 3px; border-radius: 2px; }
    input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #7c5cff; cursor: pointer; box-shadow: 0 0 0 2px rgba(124,92,255,0.25); border: none; }

    .sec-title { font-size: 10px; font-weight: 700; color: #6a6a6a; text-transform: uppercase; letter-spacing: 1.8px; margin-bottom: 10px; margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid #2a2a2a; display: block; }
    .lbl { font-size: 11px; color: #aaaaaa; font-weight: 500; display: block; margin-bottom: 4px; }

    /* Panel tabs */
    .tab-bar { display: flex; gap: 2px; margin-bottom: 4px; margin-top: 8px; background: #181818; border-radius: 6px; padding: 3px; }

    .tab-btn.active { background: #2e2e2e; color: #e0e0e0; }
    .tab-btn.inactive { background: transparent; color: #555; }
    .sec-block { margin-top: 18px; }
    .sec-block:first-child { margin-top: 0; }
    .help-menu { position:absolute; top:calc(100% + 6px); right:0; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:8px; overflow:hidden; z-index:9999; min-width:320px; max-width:360px; box-shadow:0 8px 24px rgba(0,0,0,0.55); max-height:70vh; overflow-y:auto; }
    .help-menu::-webkit-scrollbar { width:4px; } .help-menu::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
    .help-menu-item { font-family:Inter,sans-serif; font-size:11px; background:transparent; color:#bbb; border:none; padding:10px 14px; cursor:pointer; width:100%; text-align:left; display:flex; align-items:center; gap:10px; transition:background .1s; }
    .help-menu-item:hover { background:#242424; color:#e0e0e0; }
    .help-menu-sep { height:1px; background:#2a2a2a; margin:2px 0; }
    .help-accordion { border:none; background:transparent; width:100%; padding:10px 14px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; font-family:Inter,sans-serif; font-size:10px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:1.2px; transition:color .12s; }
    .help-accordion:hover { color:#bbb; }
    .help-accordion-arrow { font-size:8px; transition:transform .2s; color:#666; }
    .help-accordion-body { overflow:hidden; transition:max-height .25s ease, opacity .2s ease; }
    .help-about-text { font-family:Inter,sans-serif; font-size:11px; color:#aaa; line-height:1.65; padding:0 14px 12px; }
    .help-about-text a { color:#7c5cff; text-decoration:none; } .help-about-text a:hover { text-decoration:underline; }

    /* Progress bar */
    #zip-progress { position: fixed; top: 50px; left: 0; right: 0; height: 2px; background: #7c5cff; transform-origin: left; transform: scaleX(0); transition: transform .2s; z-index: 9990; }

    /* Preview modal */
    #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9900; }
    #preview-modal .pm-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 90vw; max-height: 90vh; }
    #preview-modal img { max-width: 70vw; max-height: 70vh; object-fit: contain; border-radius: 6px; background: #111; }
  </style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<div id="zip-progress"></div>
<div id="drop-overlay">
  <div class="box">
    <div class="icon">🖼</div>
    <div class="label">Suelta tus imágenes aquí</div>
    <div class="sub">JPEG · PNG · WebP · cualquier cantidad</div>
  </div>
</div>

<script>
  let _dc = 0;
  const ov = () => document.getElementById("drop-overlay");
  window.addEventListener("dragenter", e => { e.preventDefault(); if (++_dc===1) ov().classList.add("show"); });
  window.addEventListener("dragleave", e => { if (--_dc<=0){_dc=0;ov().classList.remove("show");} });
  window.addEventListener("dragover",  e => { e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
  window.addEventListener("drop",      e => { e.preventDefault();_dc=0;ov().classList.remove("show"); window._zirmeDrop&&window._zirmeDrop(e.dataTransfer.files); });
</script>
