            crop.y = ~~(crop.y / prescale);

          lightness = sample(id, p);

            sample(id, p) * 4 -
            sample(id, p - w * 4) -
            sample(id, p - 4) -
            sample(id, p + 4) -

          lightness <= options.saturationBrightnessMax;

  function score(options, output, crop) {

      x >= crop.x + crop.width ||
      crop.y > y ||

    var topScore = -Infinity;
    var topCrop = null;
    var crops = generateCrops(options, input.width, input.height);

    for (var i = 0, iLen = crops.length; i < iLen; i++) {
      var crop = crops[i];
      crop.score = score(options, scoreOutput, crop);
      if (crop.score.total > topScore) {

        topScore = crop.score.total;

  function downSample(input, factor) {

<script>
  let _dc = 0;
  const ov = () => document.getElementById("drop-overlay");
  window.addEventListener("dragenter", e => { e.preventDefault(); if (++_dc===1) ov().classList.add("show"); });
  window.addEventListener("dragleave", e => { if (--_dc<=0){_dc=0;ov().classList.remove("show");} });
  window.addEventListener("dragover",  e => { e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
  window.addEventListener("drop",      e => { e.preventDefault();_dc=0;ov().classList.remove("show"); window._zirmeDrop&&window._zirmeDrop(e.dataTransfer.files); });

/* ── Helpers ──────────────────────────────────────────────────────────── */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove("show"), 2600);
}
/* ── Cross-browser range fill ─────────────────────────────────────────── */
function paintRange(el) {
  const min = parseFloat(el.min) || 0,
    max = parseFloat(el.max) || 100;
  const pct = (el.value - min) / (max - min) * 100;
  el.style.background = `linear-gradient(to right, #7c5cff ${pct}%, #2e2e2e ${pct}%)`;
}
// Listen for all input events on range sliders (captures React-driven changes too)
document.addEventListener("input", e => {
  if (e.target.type === "range") paintRange(e.target);
});
// Observe DOM for new range inputs and paint them on insertion
new MutationObserver(muts => {
  for (const m of muts) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.tagName === "INPUT" && n.type === "range") paintRange(n);else if (n.querySelectorAll) n.querySelectorAll('input[type=range]').forEach(paintRange);
  }
}).observe(document.body, {
  childList: true,
  subtree: true
});
// Paint any already-existing range inputs
document.querySelectorAll('input[type=range]').forEach(paintRange);
// Periodic repaint for React-driven value updates (lightweight, ~10 elements max)
setInterval(() => document.querySelectorAll('input[type=range]').forEach(paintRange), 250);

// Wraps smartcrop.js with a graceful fallback to center-crop.
// Accepts an HTMLCanvasElement (file.ec) and target dimensions.
// Returns a crop object {x,y,w,h} in original image pixel space.
async function runSmartCrop(canvas, outW, outH) {
  if (typeof smartcrop === "undefined") return null;
  try {
    const result = await smartcrop.crop(canvas, {
      width: outW,
      height: outH,
      minScale: 1.0
    });
    const tc = result.topCrop;
    return {
      x: Math.round(tc.x),
      y: Math.round(tc.y),
      w: Math.round(tc.width),
      h: Math.round(tc.height)
    };
  } catch (e) {
    return null; // caller falls back to center crop
  }
}

// Helper para cargar scripts dinámicamente
function loadScript(src) {
  return new Promise((resolve, reject) => {
    // Verificar si ya está cargado
    if (document.querySelector(`script[src="${src}"]`)) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// Cargar todas las ML libraries de una vez
async function ensureMLLibs() {
  if (mlLibsLoaded) return true;
  if (mlLibsLoading) {
    // Esperar a que termine la carga en progreso
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (mlLibsLoaded || !mlLibsLoading) {
          clearInterval(check);
          resolve(mlLibsLoaded);
        }
      }, 100);
    });
  }
  mlLibsLoading = true;
  try {
    await Promise.all([loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0'), loadScript('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js')]);
    // COCO-SSD y PoseNet dependen de TensorFlow, cargar después
    await Promise.all([loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3'), loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js') // V11: PoseNet integrado
    ]);
    mlLibsLoaded = true;
    return true;
  } catch (e) {
    console.warn("ML libraries load failed:", e);
    return false;
  } finally {
    mlLibsLoading = false;
  }
}

async function detectFacesCrop(canvas, outW, outH, adjustToTargetSize = true) {
  const loaded = await loadFaceApi();
  if (!loaded) return null;
  try {
    const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
    if (!detections || detections.length === 0) return null;

    // Encontrar el rostro más grande o más centrado
    let bestFace = detections[0];
    if (detections.length > 1) {
      bestFace = detections.reduce((best, current) => {
        const bestSize = best.box.width * best.box.height;
        const currentSize = current.box.width * current.box.height;
        return currentSize > bestSize ? current : best;
      });
    }
    const box = bestFace.box;
    const targetRatio = outW / outH;
    if (adjustToTargetSize) {
      // MODO: Mantener tamaño mínimo (no bajar del objetivo, pero puede ser mayor)
      // Calcular el crop óptimo para la cara detectada con margen
      const margin = 0.5; // 50% de margen alrededor de la cara
      let cropW = box.width * (1 + margin * 2);
      let cropH = box.height * (1 + margin * 2);

      // Ajustar al ratio objetivo
      const currentRatio = cropW / cropH;
      if (currentRatio > targetRatio) {
        cropH = cropW / targetRatio;
      } else {
        cropW = cropH * targetRatio;
      }

      // CRÍTICO: No permitir que sea menor que el tamaño objetivo
      if (cropW < outW || cropH < outH) {
        const scale = Math.max(outW / cropW, outH / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }

      // Si es más grande que el canvas, escalar
      if (cropW > canvas.width || cropH > canvas.height) {
        const scale = Math.min(canvas.width / cropW, canvas.height / cropH);
        cropW = cropW * scale;
        cropH = cropH * scale;
      }

      // Centrar en el rostro (priorizar mostrar más espacio arriba)
      let cropX = box.x + box.width / 2 - cropW / 2;
      let cropY = box.y + box.height / 2 - cropH / 2 - box.height * 0.3;

      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      return {
        x: Math.round(cropX),
        y: Math.round(cropY),
        w: Math.round(cropW),
        h: Math.round(cropH)
      };
    } else {
      // MODO: Crop automático (ajustado a la cara)
      const margin = 0.15;
      let cropW = box.width * (1 + margin * 2);
      let cropH = box.height * (1 + margin * 2);

      // Ajustar al ratio objetivo manteniendo la cara bien encuadrada
      const currentRatio = cropW / cropH;
      if (currentRatio > targetRatio) {
        cropH = cropW / targetRatio;
      } else {
        cropW = cropH * targetRatio;
      }

      // Centrar en el rostro (priorizar mostrar más espacio arriba)
      let cropX = box.x + box.width / 2 - cropW / 2;
      let cropY = box.y + box.height / 2 - cropH / 2 - box.height * 0.2;

      // Clamp dentro del canvas
      cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
      cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
      cropW = Math.min(cropW, canvas.width - cropX);
      cropH = Math.min(cropH, canvas.height - cropY);
      return {
        x: Math.round(cropX),
        y: Math.round(cropY),
        w: Math.round(cropW),
        h: Math.round(cropH)
      };
    }
  } catch (e) {
    console.warn("Face detection failed:", e);
    return null;
  }
}

// V11.1: JERARQUÍA CORRECTA: PoseNet → Face-API → COCO-SSD
async function detectBodyCrop(canvas, outW, outH, adjustToTargetSize = true, poseNetEnabled = false) {
  const targetRatio = outW / outH;
  let detectionMethod = 'none';
  try {
    // ═══════════════════════════════════════════════════════════════════
    // NIVEL 1: POSENET (Detecta hombros aunque rostro esté tapado)
    // ═══════════════════════════════════════════════════════════════════
    if (poseNetEnabled) {
      const poseLoaded = await loadPoseNet();
      if (poseLoaded && poseNetModel) {
        try {
          const pose = await poseNetModel.estimateSinglePose(canvas, {
            flipHorizontal: false
          });
          if (pose && pose.score > 0.25) {
            // Buscar hombros - SON LA CLAVE cuando rostro está tapado
            const leftShoulder = pose.keypoints.find(kp => kp.part === 'leftShoulder');
            const rightShoulder = pose.keypoints.find(kp => kp.part === 'rightShoulder');
            if (leftShoulder?.score > 0.35 && rightShoulder?.score > 0.35) {
              detectionMethod = 'posenet-shoulders';
              console.log(`✓ PoseNet: hombros detectados (L:${leftShoulder.score.toFixed(2)} R:${rightShoulder.score.toFixed(2)})`);
              const shoulderY = (leftShoulder.position.y + rightShoulder.position.y) / 2;
              const shoulderX = (leftShoulder.position.x + rightShoulder.position.x) / 2;
              const shoulderWidth = Math.abs(rightShoulder.position.x - leftShoulder.position.x);

              // Calcular bbox desde hombros
              const bodyWidth = shoulderWidth * 2.5; // Ancho típico del cuerpo
              const bodyHeight = shoulderWidth * 3.2; // Alto típico desde hombros a pies

              let cropW = bodyWidth * 1.15;
              let cropH = bodyHeight * 1.15;

              // Ajustar al ratio
              if (cropW / cropH > targetRatio) {
                cropH = cropW / targetRatio;
              } else {
                cropW = cropH * targetRatio;
              }

              // V11.3: VALIDACIÓN ESTRICTA - SIEMPRE respetar outW/outH como mínimo absoluto
              // Independientemente de adjustToTargetSize, NUNCA bajar del mínimo
              if (cropW < outW || cropH < outH) {
                const scale = Math.max(outW / cropW, outH / cropH);
                cropW *= scale;
                cropH *= scale;
              }
              let cropX = shoulderX - cropW / 2;
              let cropY = shoulderY;

              // Clamp
              cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
              cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
              cropW = Math.min(cropW, canvas.width - cropX);
              cropH = Math.min(cropH, canvas.height - cropY);
              return {
                x: Math.round(cropX),
                y: Math.round(cropY),
                w: Math.round(cropW),
                h: Math.round(cropH),
                _method: detectionMethod,
                _poseScore: pose.score.toFixed(2)
              };
            }
          }
        } catch (pe) {
          console.warn("PoseNet detection failed:", pe);
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // NIVEL 2: FACE-API (Crop preciso desde clavícula)
    // ═══════════════════════════════════════════════════════════════════
    const faceLoaded = await loadFaceApi();
    if (faceLoaded) {
      try {
        const faces = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
        if (faces && faces.length > 0) {
          detectionMethod = 'face-clavicle';
          console.log(`✓ Face-API: rostro detectado`);
          const face = faces.reduce((best, current) => {
            const bestSize = best.box.width * best.box.height;
            const currentSize = current.box.width * current.box.height;
            return currentSize > bestSize ? current : best;
          });

          // Crop desde clavícula (50% debajo del rostro)
          const clavicleY = face.box.y + face.box.height * 1.5;
          const faceCenter = face.box.x + face.box.width / 2;

          // Estimar dimensiones del cuerpo desde rostro
          const estimatedWidth = face.box.width * 3.5;
          const estimatedHeight = face.box.height * 6;
          let cropW = estimatedWidth * 1.1;
          let cropH = estimatedHeight * 1.1;

          // Ajustar al ratio
          if (cropW / cropH > targetRatio) {
            cropH = cropW / targetRatio;
          } else {
            cropW = cropH * targetRatio;
          }

          // V11.3: VALIDACIÓN ESTRICTA - SIEMPRE respetar mínimo
          if (cropW < outW || cropH < outH) {
            const scale = Math.max(outW / cropW, outH / cropH);
            cropW *= scale;
            cropH *= scale;
          }
          let cropX = faceCenter - cropW / 2;
          let cropY = clavicleY;

          // Clamp
          cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
          cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
          cropW = Math.min(cropW, canvas.width - cropX);
          cropH = Math.min(cropH, canvas.height - cropY);
          return {
            x: Math.round(cropX),
            y: Math.round(cropY),
            w: Math.round(cropW),
            h: Math.round(cropH),
            _method: detectionMethod
          };
        }
      } catch (fe) {
        console.warn("Face detection failed:", fe);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // NIVEL 3: COCO-SSD (Fallback conservador SIN rostro)
    // ═══════════════════════════════════════════════════════════════════
    const cocoLoaded = await loadCocoSsd();
    if (!cocoLoaded) return null;
    const predictions = await cocoSsdModel.detect(canvas);
    const people = predictions.filter(p => p.class === 'person');
    if (people.length === 0) return null;

    // Encontrar persona más grande
    const bestPerson = people.reduce((best, current) => {
      const bestSize = best.bbox[2] * best.bbox[3];
      const currentSize = current.bbox[2] * current.bbox[3];
      return currentSize > bestSize ? current : best;
    });
    detectionMethod = 'coco-conservative';
    console.log(`⚠ COCO-SSD: sin rostro/hombros → modo conservador`);
    let [x, y, width, height] = bestPerson.bbox;

    // V11.1 CRÍTICO: Modo conservador sin forzar tamaño
    // Quitar solo 12% superior (MUY conservador)
    const headOffset = height * 0.12;
    y = y + headOffset;
    height = height - headOffset;

    // Margen moderado
    let cropW = width * 1.25;
    let cropH = height * 1.25;

    // Ajustar SOLO al ratio, NO al tamaño
    if (cropW / cropH > targetRatio) {
      cropH = cropW / targetRatio;
    } else {
      cropW = cropH * targetRatio;
    }

    // V11.3: VALIDACIÓN ESTRICTA - SIEMPRE respetar mínimo (incluso en modo conservador)
    if (cropW < outW || cropH < outH) {
      const scale = Math.max(outW / cropW, outH / cropH);
      cropW *= scale;
      cropH *= scale;
    }
    let cropX = x + width / 2 - cropW / 2;
    let cropY = y;

    // Clamp
    cropX = Math.max(0, Math.min(cropX, canvas.width - cropW));
    cropY = Math.max(0, Math.min(cropY, canvas.height - cropH));
    cropW = Math.min(cropW, canvas.width - cropX);
    cropH = Math.min(cropH, canvas.height - cropY);
    return {
      x: Math.round(cropX),
      y: Math.round(cropY),
      w: Math.round(cropW),
      h: Math.round(cropH),
      _method: detectionMethod,
      _conservative: true
    };
  } catch (e) {
    console.error("Body detection failed:", e);
    return null;
  }
}

/* ── focalCrop — anchor-based auto crop ───────────────────────────────── */
// ax/ay ∈ {0=start, 0.5=center, 1=end}
// The chosen anchor point determines which region of the image fills the output.
function focalCrop(iW, iH, oW, oH, ax, ay) {
  const ta = oW / oH,
    ia = iW / iH;
  let cW = iW,
    cH = iH;
  if (ia > ta) cW = iH * ta;else cH = iW / ta;
  return {
    x: Math.round(ax * (iW - cW)),
    y: Math.round(ay * (iH - cH)),
    w: Math.round(cW),
    h: Math.round(cH)
  };
}
function snapCanvas(c) {
  const s = document.createElement("canvas");
  s.width = c.width;
  s.height = c.height;
  s.getContext("2d").drawImage(c, 0, 0);
  return s;
}
function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}
function clampCrop(crop, iW, iH, ratio) {
  let {
    x,
    y,
    w,
    h
  } = crop;
  w = Math.max(10, w);
  h = Math.max(10, h);
  // Fit dimensions within image, respecting ratio if locked
  if (ratio) {
    w = Math.min(w, iW);
    h = Math.min(h, iH);
    if (w / h > ratio) w = h * ratio;else h = w / ratio;
    if (w > iW) {
      w = iW;
      h = w / ratio;
    }
    if (h > iH) {
      h = iH;
      w = h * ratio;
    }
  } else {
    w = Math.min(w, iW);
    h = Math.min(h, iH);
  }
  // Clamp position so crop sits inside image
  x = Math.max(0, Math.min(x, iW - w));
  y = Math.max(0, Math.min(y, iH - h));
  // Final strict guarantee: right/bottom edges never exceed image bounds
  w = Math.min(w, iW - x);
  h = Math.min(h, iH - y);
  return {
    x,
    y,
    w,
    h
  };
}
const HANDLES = [{
  hx: 0,
  hy: 0,
  cx: "nw-resize"
}, {
  hx: 0.5,
  hy: 0,
  cx: "n-resize"
}, {
  hx: 1,

}, {

/* ── drawCropShadow ───────────────────────────────────────────────────── */
function drawCropShadow(ctx, cr, sc, offX, offY, iW, iH) {
  if (!cr || cr.w < 2) return;
  const cx = cr.x * sc + offX,
    cy = cr.y * sc + offY;
  const cw = cr.w * sc,
    ch = cr.h * sc;
  const r = offX + iW * sc,
    b = offY + iH * sc;

  // Darken outside
  ctx.fillStyle = "rgba(0,0,0,0.58)";
  ctx.fillRect(offX, offY, r - offX, cy - offY);
  ctx.fillRect(offX, cy + ch, r - offX, b - (cy + ch));
  ctx.fillRect(offX, cy, cx - offX, ch);
  ctx.fillRect(cx + cw, cy, r - (cx + cw), ch);

  // Outer border — double-stroke (no shadowBlur: keeps GPU path, avoids lag on large crops)
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineWidth = 3.5;
  ctx.strokeRect(cx, cy, cw, ch);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cx, cy, cw, ch);

  // Rule of thirds — batched into a single path (4× fewer draw calls)
  ctx.beginPath();
  for (let i = 1; i < 3; i++) {
    ctx.moveTo(cx + cw * i / 3, cy + 1);
    ctx.lineTo(cx + cw * i / 3, cy + ch - 1);
    ctx.moveTo(cx + 1, cy + ch * i / 3);
    ctx.lineTo(cx + cw - 1, cy + ch * i / 3);
  }
  ctx.strokeStyle = "rgba(255,255,255,0.65)";
  ctx.lineWidth = 0.75;
  ctx.stroke();

  // Handles — shadow via dark underlay rect (no shadowBlur)
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  HANDLES.forEach(({
    hx,
    hy
  }) => {
    const hpx = cx + cw * hx,
      hpy = cy + ch * hy;
    ctx.fillRect(hpx - HS / 2 - 1.5, hpy - HS / 2 - 1.5, HS + 3, HS + 3);
  });
  ctx.fillStyle = "#ffffff";
  HANDLES.forEach(({
    hx,
    hy
  }) => {
    const hpx = cx + cw * hx,
      hpy = cy + ch * hy;
    ctx.fillRect(hpx - HS / 2, hpy - HS / 2, HS, HS);
  });
}
function hitHandle(px, py, cr, sc, offX, offY) {
  if (!cr || cr.w < 2) return -1;
  const cx = cr.x * sc + offX,
    cy = cr.y * sc + offY,
    cw = cr.w * sc,
    ch = cr.h * sc;
  for (let i = 0; i < HANDLES.length; i++) {
    const {
      hx,
      hy
    } = HANDLES[i];
    if (Math.abs(px - (cx + cw * hx)) < HS + 4 && Math.abs(py - (cy + ch * hy)) < HS + 4) return i;
  }
  return -1;
}

/* ── buildRows ────────────────────────────────────────────────────────── */
function buildRows(files, targetH, containerW, gap) {
  if (!files.length || !containerW) return [];
  const rows = [];
  let row = [],
    rowRatioSum = 0;
  for (const f of files) {
    const ratio = (f.ec?.width || 1) / (f.ec?.height || 1);
    row.push({
      file: f,
      ratio
    });
    rowRatioSum += ratio;
    const totalW = rowRatioSum * targetH + gap * (row.length - 1);
    if (totalW >= containerW) {
      const scale = (containerW - gap * (row.length - 1)) / (rowRatioSum * targetH);
      const h = Math.round(targetH * scale);
      rows.push(row.map(it => ({
        file: it.file,
        w: Math.round(it.ratio * h),
        h
      })));
      row = [];
      rowRatioSum = 0;
    }
  }
  if (row.length) rows.push(row.map(it => ({
    file: it.file,
    w: Math.round(it.ratio * targetH),
    h: targetH
  })));
  return rows;
}

              <button onClick={()=>setMultiSel(new Set())}
                style={{background:"transparent",border:"1px solid rgba(124,92,255,0.35)",borderRadius:5,color:"#a78bfa",cursor:"pointer",fontSize:11,padding:"2px 9px",flexShrink:0,fontFamily:"Inter,sans-serif",transition:"background .12s"}}

            </div>
          ):(
            <JustifiedGrid
              files={files} cellH={cellH} settings={settings}
              selId={selId} multiSel={multiSel} t={t} tick={tick}
              onSelect={handleSelect} onCropChange={setCropForId}
              onUndoPush={pushUndo} onRemove={removeFile}
              onEdit={setEditId} onPreview={setPreviewId}
              loadFiles={loadFiles} onReorder={reorderFiles}
            />
          )}
        </div>

        {/* Panel toggle button — hidden while editor is active to avoid overlap */}
        {!panelOpen&&!editFile&&(
          <button onClick={()=>setPanelOpen(true)}
            style={{position:"absolute",right:0,top:"50%",transform:"translateY(-50%)",zIndex:50,fontFamily:"Inter",fontSize:11,background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:"6px 0 0 6px",color:"#666",padding:"12px 6px",cursor:"pointer",writingMode:"vertical-lr",letterSpacing:1}}>
            {t.panelShow}
          </button>
        )}

        {/* Right panel */}
        {panelOpen&&(
        <aside style={{width:360,background:"#1e1e1e",borderLeft:"1px solid #242424",overflowY:"auto",padding:"10px 14px",flexShrink:0,display:"flex",flexDirection:"column"}}>

          {/* Panel hide button */}
          <button onClick={()=>setPanelOpen(false)}
            style={{fontFamily:"Inter,sans-serif",fontSize:10,background:"transparent",border:"none",color:"#444",cursor:"pointer",textAlign:"right",padding:"2px 0",marginBottom:4}}>
            {t.panelHide}
          </button>

          {/* Tabs */}
          <div className="tab-bar">
            <button className={"tab-btn "+(panelTab==="image"?"active":"inactive")} onClick={()=>setPanelTab("image")}>{t.tabImage}</button>
            <button className={"tab-btn "+(panelTab==="export"?"active":"inactive")} onClick={()=>setPanelTab("export")}>{t.tabExport}</button>
          </div>

          {/* ─── EDITAR TAB ─── */}
          {panelTab==="image"&&(<>

            {/* VISTA */}
            <div className="sec-block">
              <span className="sec-title">{t.secThumbs}</span>
              <label className="lbl">{t.thumbSize(cellH)}</label>
              <input type="range" min={180} max={700} value={cellH} onChange={e=>setCellH(+e.target.value)} style={{marginBottom:6}}/>
            </div>

            {/* COMPOSICIÓN */}
            <div className="sec-block">
              <span className="sec-title">{t.secComposition}</span>

              {/* Tamaño de salida - botones */}
              <label className="lbl">{t.secOutput}</label>
              <div style={{display:"flex",gap:4,marginBottom:12,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {["fixed","autoW","autoH"].map(m=>(
                  <button key={m} onClick={()=>setSettings(s=>({...s,sizeMode:m}))}
                    style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:settings.sizeMode===m?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                      background:settings.sizeMode===m?"#7c5cff":"transparent",
                      color:settings.sizeMode===m?"#fff":"#555",whiteSpace:"nowrap"}}>
                    {m==="fixed"?t.sizeFixed:m==="autoW"?t.sizeAutoW:t.sizeAutoH}
                  </button>
                ))}
              </div>

              {/* Bloquear proporción - solo en modo fixed */}
              {settings.sizeMode==="fixed"&&<>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <label className="lbl" style={{marginBottom:0}}>{t.lockAspectRatio}</label>
                  <button onClick={()=>setSettings(s=>({...s,lockAspect:!s.lockAspect}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"3px 10px",cursor:"pointer",transition:"all .12s",
                      background:settings.lockAspect?"#7c5cff":"transparent",
                      borderColor:settings.lockAspect?"#7c5cff":"#2e2e2e",
                      color:settings.lockAspect?"#fff":"#555"}}>
                    {settings.lockAspect?"ON":"OFF"}
                  </button>
                </div>
              </>}

              {/* Ancho */}
              {settings.sizeMode!=="autoW"&&<>
                <label className="lbl">{t.widthLbl}</label>
                <input type="number" min={1} value={settings.w} onChange={e=>{
                  const newW = parseInt(e.target.value, 10);
                  if(!newW || newW < 1) return;
                  if(settings.lockAspect && settings.sizeMode==="fixed"){
                    const ratio = settings.w / settings.h;
                    setSettings(s=>({...s, w:newW, h:Math.round(newW/ratio)}));
                  } else {
                    setSettings(s=>({...s, w:newW}));
                  }
                }} style={{marginBottom:8}}/>
              </>}

              {/* Alto */}
              {settings.sizeMode!=="autoH"&&<>
                <label className="lbl">{t.heightLbl}</label>
                <input type="number" min={1} value={settings.h} onChange={e=>{
                  const newH = parseInt(e.target.value, 10);
                  if(!newH || newH < 1) return;
                  if(settings.lockAspect && settings.sizeMode==="fixed"){
                    const ratio = settings.w / settings.h;
                    setSettings(s=>({...s, h:newH, w:Math.round(newH*ratio)}));
                  } else {
                    setSettings(s=>({...s, h:newH}));
                  }
                }} style={{marginBottom:8}}/>
              </>}

              {settings.sizeMode==="fixed"&&<div style={{fontSize:10,color:"#555",marginBottom:4}}>{t.ratioLbl}: {oW/dv}:{oH/dv}</div>}

              {/* Foco de recorte - 4 MODOS */}
              <label className="lbl" style={{marginTop:12}}>{t.cropModeLbl}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:4,marginBottom:8,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {[
                  {mode:"auto",label:t.cropModeAuto},
                  {mode:"manual",label:t.cropModeManual},
                  {mode:"face",label:t.cropModeFace},
                  {mode:"body",label:t.cropModeBody}
                ].map(({mode,label})=>{
                  const isActive = settings.detectionMode===mode;
                  const iconColor = isActive?"#fff":"#666";
                  
                  // Iconos SVG minimalistas
                  const icons = {
                    auto: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.196-14.196l-4.242 4.242m0 5.908l4.242 4.242M23 12h-6m-6 0H1m14.196 5.196l-4.242-4.242m0-5.908l-4.242-4.242"/></svg>,
                    manual: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
                    face: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>,
                    body: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v5m0 0l-3 6m3-6l3 6M9 12l-2-2m8 2l2-2"/></svg>
                  };
                  
                  return (
                    <button key={mode} onClick={async()=>{
                      // Si es modo ML y no han dicho "no volver a preguntar", mostrar diálogo
                      if((mode==="face"||mode==="body") && !mlDontShowAgain){
                        setMlWarningDialog({show:true, mode});
                      } else {
                        // Capturar valores AHORA (antes de setState)
                        const currentMode = mode;
                        const currentFocalAuto = mode !== "manual";
                        const currentSettings = settingsRef.current;
                        const currentSelId = selIdRef.current;
                        const currentMultiSel = new Set(multiSelRef.current);
                        
                        // Aplicar settings
                        setSettings(s=>({...s,detectionMode:mode,focalAuto:mode!=="manual"}));
                        
                        // Ejecutar INMEDIATAMENTE con valores capturados
                        const{w:oW,h:oH,focalPoint,adjustToTargetSize,poseNetEnabled}=currentSettings;
                        
                        // Determinar targets
                        let targets;
                        if(currentSelId && currentMultiSel.size===0) {
                          targets = [currentSelId];
                        } else if(currentMultiSel.size > 0) {
                          targets = [...currentMultiSel];
                        } else {
                          targets = filesRef.current.map(f=>f.id);
                        }
                        
                        if(!targets.length) return;
                        
                        setSmartBatch({running:true,done:0,total:targets.length});
                        let applied=0;
                        
                        for(let i=0;i<targets.length;i++){
                          const id=targets[i];
                          const f=filesRef.current.find(ff=>ff.id===id);
                          if(!f){ setSmartBatch(s=>({...s,done:s.done+1})); continue; }
                          let nc=null;
                          
                          if(currentMode === "face"){
                            nc = await detectFacesCrop(f.ec, oW, oH, adjustToTargetSize);
                          } else if(currentMode === "body"){
                            nc = await detectBodyCrop(f.ec, oW, oH, adjustToTargetSize, poseNetEnabled);
                          } else if(currentFocalAuto && currentMode === "auto"){
                            nc = await runSmartCrop(f.ec, oW, oH);
                          }
                          
                          if(!nc||nc.w<2||nc.h<2){
                            const{ax,ay}=focalPoint||{ax:0.5,ay:0.5};
                            nc=focalCrop(f.ec.width,f.ec.height,oW,oH,ax,ay);
                          }
                          const crop={...nc,auto:true};
                          setFiles(prev=>prev.map(ff=>ff.id===id?{...ff,crop}:ff));
                          applied++;
                          setSmartBatch(s=>({...s,done:s.done+1}));
                        }
                        
                        setSmartBatch({running:false,done:0,total:0});
                        const modeLabel = currentMode==="face"?t.detFaces:currentMode==="body"?t.detBodies:"";
                        const countMsg = targets.length===1 ? t.toastProcessed1 : t.toastCroppedN(applied);
                        showToast(modeLabel ? `✦ ${countMsg} (${modeLabel})` : `✦ ${countMsg}`);
                      }
                    }}
                      style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:isActive?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                        background:isActive?"#7c5cff":"transparent",
                        color:isActive?"#fff":"#555",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                      {icons[mode]}
                      <span>{label}</span>
                    </button>
                  );
                })}
              </div>

              {/* Toggle ajustar tamaño objetivo (solo para modos ML) */}
              {(settings.detectionMode==="face"||settings.detectionMode==="body")&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,padding:"8px",background:"#1a1a1a",borderRadius:4}}>
                  <label className="lbl" style={{marginBottom:0,fontSize:10}}>{t.adjustToTargetSize}</label>
                  <button onClick={()=>setSettings(s=>({...s,adjustToTargetSize:!s.adjustToTargetSize}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:9,fontWeight:600,border:"1px solid",borderRadius:3,padding:"2px 8px",cursor:"pointer",transition:"all .12s",
                      background:settings.adjustToTargetSize?"#7c5cff":"transparent",
                      borderColor:settings.adjustToTargetSize?"#7c5cff":"#2e2e2e",
                      color:settings.adjustToTargetSize?"#fff":"#555"}}>
                    {settings.adjustToTargetSize?"ON":"OFF"}
                  </button>
                </div>
              )}
