                    <a href="https://github.com/tensorflow/tfjs-models/tree/master/coco-ssd" target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",gap:6}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="#7c5cff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                      COCO-SSD
                    </a>
                    <a href="https://github.com/vladmandic/face-api" target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",gap:6}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="#7c5cff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                      Face-API.js
                    </a>
                  </div>
                </div>
              </div>

            </div>
          )}
        </div>
        <div style={{width:1,height:16,background:"#2a2a2a"}}/>
        {/* Lang selector */}
        <div ref={langRef} style={{position:"relative"}}>
          <button onClick={()=>setLangOpen(o=>!o)} style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:500,background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:5,color:"#aaa",padding:"5px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>
            {langNames[lang]}
            <span style={{fontSize:10,color:"#555",marginLeft:2,display:"inline-block",transform:langOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .15s"}}>▾</span>
          </button>
          {langOpen&&(
            <div style={{position:"absolute",top:"calc(100% + 6px)",right:0,background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:6,overflow:"hidden",zIndex:9999,minWidth:"110px",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
              {Object.entries(langNames).map(([code,name])=>(
                <button key={code} onClick={()=>{setLang(code);setLangOpen(false);}}
                  style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:code===lang?600:400,background:code===lang?"#2a2a2a":"transparent",color:code===lang?"#e0e0e0":"#888",border:"none",padding:"9px 14px",cursor:"pointer",width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:8}}
                  onMouseEnter={e=>{if(code!==lang)e.currentTarget.style.background="#222";}}
                  onMouseLeave={e=>{if(code!==lang)e.currentTarget.style.background="transparent";}}>
                  {code===lang&&<span style={{color:"#7c5cff",fontSize:10}}>●</span>}
                  {code!==lang&&<span style={{fontSize:10,opacity:0}}>●</span>}
                  {name}
                </button>
              ))}
            </div>
          )}
        </div>
        <button onClick={undoSel} disabled={!canUndo} title="Ctrl+Z"
          style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:500,border:"1px solid #282828",borderRadius:5,padding:"5px 11px",cursor:canUndo?"pointer":"not-allowed",background:"transparent",color:canUndo?"#d0d0d0":"#333",display:"flex",alignItems:"center",gap:5,opacity:canUndo?1:0.4}}>
          ↩ {canUndo?t.undoCount((sel?.history||[]).length):t.undo}
        </button>
        <button onClick={redoSel} disabled={!canRedo} title="Ctrl+Y"
          style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:500,border:"1px solid #282828",borderRadius:5,padding:"5px 11px",cursor:canRedo?"pointer":"not-allowed",background:"transparent",color:canRedo?"#d0d0d0":"#333",display:"flex",alignItems:"center",gap:5,opacity:canRedo?1:0.4}}>
          ↪ {canRedo?t.redoCount((sel?.future||[]).length):t.redo}
        </button>
        <label style={{fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:600,background:PURPLE,border:"none",borderRadius:5,padding:"7px 14px",cursor:"pointer",color:"#fff",whiteSpace:"nowrap"}}>
          {t.add}
          <input type="file" accept="image/*" multiple onChange={e=>loadFiles(e.target.files)} style={{display:"none"}}/>
        </label>
      </header>

      {/* Body */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* Grid */}
        <div style={{flex:1,overflowY:"auto",padding:16,position:"relative"}}
             onClick={(e)=>{
               // Deseleccionar si se hace click en el fondo vacío
               if(e.target === e.currentTarget || e.target.closest('.justified-grid-bg')){
                 setSelId(null);
                 setMultiSel(new Set());
               }
             }}>
          {/* Multi-select hint */}
          {multiSel.size>0&&(
            <div style={{position:"sticky",top:0,zIndex:10,background:"rgba(124,92,255,0.12)",border:"1px solid rgba(124,92,255,0.3)",borderRadius:6,padding:"6px 12px",marginBottom:10,fontSize:11,color:"#a78bfa",display:"flex",alignItems:"center",gap:10}}>
              <span>✓ {multiSel.size} {lang==="es"?"imágenes seleccionadas":"images selected"}</span>
              <button onClick={()=>setMultiSel(new Set())} style={{background:"transparent",border:"none",color:"#666",cursor:"pointer",fontSize:12}}>✕</button>
            </div>
          )}
          {files.length===0?(
            <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,color:"#282828"}}>
              <div style={{fontSize:64}}>🖼</div>
              <div style={{fontSize:16,fontWeight:500}}>{t.emptyHint}</div>
              <div style={{fontSize:12}}>{t.emptySub}</div>
            </div>
          ):(
            <JustifiedGrid
              files={files} cellH={cellH} settings={settings}
              selId={selId} multiSel={multiSel} t={t} tick={tick}
              onSelect={handleSelect} onCropChange={setCropForId}
              onUndoPush={pushUndo} onRemove={removeFile}
              onEdit={setEditId} onPreview={setPreviewId}
              loadFiles={loadFiles} onReorder={reorderFiles}
            />
          )}
        </div>

        {/* Panel toggle button — hidden while editor is active to avoid overlap */}
        {!panelOpen&&!editFile&&(
          <button onClick={()=>setPanelOpen(true)}
            style={{position:"absolute",right:0,top:"50%",transform:"translateY(-50%)",zIndex:50,fontFamily:"Inter",fontSize:11,background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:"6px 0 0 6px",color:"#666",padding:"12px 6px",cursor:"pointer",writingMode:"vertical-lr",letterSpacing:1}}>
            {t.panelShow}
          </button>
        )}

        {/* Right panel */}
        {panelOpen&&(
        <aside style={{width:360,background:"#1e1e1e",borderLeft:"1px solid #242424",overflowY:"auto",padding:"10px 14px",flexShrink:0,display:"flex",flexDirection:"column"}}>

          {/* Panel hide button */}
          <button onClick={()=>setPanelOpen(false)}
            style={{fontFamily:"Inter,sans-serif",fontSize:10,background:"transparent",border:"none",color:"#444",cursor:"pointer",textAlign:"right",padding:"2px 0",marginBottom:4}}>
            {t.panelHide}
          </button>

          {/* Tabs */}
          <div className="tab-bar">
            <button className={"tab-btn "+(panelTab==="image"?"active":"inactive")} onClick={()=>setPanelTab("image")}>{t.tabImage}</button>
            <button className={"tab-btn "+(panelTab==="export"?"active":"inactive")} onClick={()=>setPanelTab("export")}>{t.tabExport}</button>
          </div>

          {/* ─── EDITAR TAB ─── */}
          {panelTab==="image"&&(<>

            {/* VISTA */}
            <div className="sec-block">
              <span className="sec-title">{t.secThumbs}</span>
              <label className="lbl">{t.thumbSize(cellH)}</label>
              <input type="range" min={180} max={700} value={cellH} onChange={e=>setCellH(+e.target.value)} style={{marginBottom:6}}/>
            </div>

            {/* COMPOSICIÓN */}
            <div className="sec-block">
              <span className="sec-title">{t.secComposition}</span>

              {/* Tamaño de salida - botones */}
              <label className="lbl">{t.secOutput}</label>
              <div style={{display:"flex",gap:4,marginBottom:12,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {["fixed","autoW","autoH"].map(m=>(
                  <button key={m} onClick={()=>setSettings(s=>({...s,sizeMode:m}))}
                    style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:settings.sizeMode===m?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                      background:settings.sizeMode===m?"#7c5cff":"transparent",
                      color:settings.sizeMode===m?"#fff":"#555",whiteSpace:"nowrap"}}>
                    {m==="fixed"?t.sizeFixed:m==="autoW"?t.sizeAutoW:t.sizeAutoH}
                  </button>
                ))}
              </div>

              {/* Bloquear proporción - solo en modo fixed */}
              {settings.sizeMode==="fixed"&&<>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <label className="lbl" style={{marginBottom:0}}>{lang==="es"?"Bloquear proporción":"Lock aspect ratio"}</label>
                  <button onClick={()=>setSettings(s=>({...s,lockAspect:!s.lockAspect}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"3px 10px",cursor:"pointer",transition:"all .12s",
                      background:settings.lockAspect?"#7c5cff":"transparent",
                      borderColor:settings.lockAspect?"#7c5cff":"#2e2e2e",
                      color:settings.lockAspect?"#fff":"#555"}}>
                    {settings.lockAspect?"ON":"OFF"}
                  </button>
                </div>
              </>}

              {/* Ancho */}
              {settings.sizeMode!=="autoW"&&<>
                <label className="lbl">{t.widthLbl}</label>
                <input type="number" min={1} value={settings.w} onChange={e=>{
                  const newW = +e.target.value;
                  if(settings.lockAspect && settings.sizeMode==="fixed"){
                    const ratio = settings.w / settings.h;
                    setSettings(s=>({...s, w:newW, h:Math.round(newW/ratio)}));
                  } else {
                    setSettings(s=>({...s, w:newW}));
                  }
                }} style={{marginBottom:8}}/>
              </>}

              {/* Alto */}
              {settings.sizeMode!=="autoH"&&<>
                <label className="lbl">{t.heightLbl}</label>
                <input type="number" min={1} value={settings.h} onChange={e=>{
                  const newH = +e.target.value;
                  if(settings.lockAspect && settings.sizeMode==="fixed"){
                    const ratio = settings.w / settings.h;
                    setSettings(s=>({...s, h:newH, w:Math.round(newH*ratio)}));
                  } else {
                    setSettings(s=>({...s, h:newH}));
                  }
                }} style={{marginBottom:8}}/>
              </>}

              {settings.sizeMode==="fixed"&&<div style={{fontSize:10,color:"#555",marginBottom:4}}>{t.ratioLbl}: {oW/dv}:{oH/dv}</div>}

              {/* Foco de recorte - 4 MODOS */}
              <label className="lbl" style={{marginTop:12}}>{lang==="es"?"Modo de recorte":"Crop mode"}</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:4,marginBottom:8,background:"#181818",borderRadius:6,padding:3,border:"1px solid #242424"}}>
                {[
                  {mode:"auto",label:lang==="es"?"Auto":"Auto"},
                  {mode:"manual",label:lang==="es"?"Manual":"Manual"},
                  {mode:"face",label:lang==="es"?"Rostro":"Face"},
                  {mode:"body",label:lang==="es"?"Cuerpo":"Body"}
                ].map(({mode,label})=>{
                  const isActive = settings.detectionMode===mode;
                  const iconColor = isActive?"#fff":"#666";
                  
                  // Iconos SVG minimalistas
                  const icons = {
                    auto: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.196-14.196l-4.242 4.242m0 5.908l4.242 4.242M23 12h-6m-6 0H1m14.196 5.196l-4.242-4.242m0-5.908l-4.242-4.242"/></svg>,
                    manual: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
                    face: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>,
                    body: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v5m0 0l-3 6m3-6l3 6M9 12l-2-2m8 2l2-2"/></svg>
                  };
                  
                  return (
                    <button key={mode} onClick={()=>{
                      // Si es modo ML y no han dicho "no volver a preguntar", mostrar diálogo
                      if((mode==="face"||mode==="body") && !mlDontShowAgain){
                        setMlWarningDialog({show:true, mode});
                      } else {
                        // Aplicar directamente
                        setSettings(s=>({...s,detectionMode:mode,focalAuto:mode!=="manual"}));
                        if(mode!=="manual"){
                          setTimeout(()=>applyFocalAll(),100);
                        }
                      }
                    }}
                      style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:isActive?600:400,border:"none",borderRadius:4,padding:"7px 4px",cursor:"pointer",transition:"all .12s",
                        background:isActive?"#7c5cff":"transparent",
                        color:isActive?"#fff":"#555",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                      {icons[mode]}
                      <span>{label}</span>
                    </button>
                  );
                })}
              </div>

              {/* Toggle ajustar tamaño objetivo (solo para modos ML) */}
              {(settings.detectionMode==="face"||settings.detectionMode==="body")&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,padding:"8px",background:"#1a1a1a",borderRadius:4}}>
                  <label className="lbl" style={{marginBottom:0,fontSize:10}}>{lang==="es"?"Ajustar al tamaño objetivo":"Adjust to target size"}</label>
                  <button onClick={()=>setSettings(s=>({...s,adjustToTargetSize:!s.adjustToTargetSize}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:9,fontWeight:600,border:"1px solid",borderRadius:3,padding:"2px 8px",cursor:"pointer",transition:"all .12s",
                      background:settings.adjustToTargetSize?"#7c5cff":"transparent",
                      borderColor:settings.adjustToTargetSize?"#7c5cff":"#2e2e2e",
                      color:settings.adjustToTargetSize?"#fff":"#555"}}>
                    {settings.adjustToTargetSize?"ON":"OFF"}
                  </button>
                </div>
              )}

              {/* Info de cada modo */}
              {settings.detectionMode!=="manual"&&settings.detectionMode!=="auto"&&(
                <div style={{fontSize:9,color:"#888",marginBottom:10,padding:"6px 8px",background:"#1a1a1a",borderRadius:4,lineHeight:1.4}}>
                  {settings.detectionMode==="face"&&(lang==="es"
                    ?(settings.adjustToTargetSize?"Mantiene el tamaño objetivo centrando en rostros":"Ajusta el crop automáticamente a cada rostro")
                    :(settings.adjustToTargetSize?"Maintains target size centering on faces":"Automatically adjusts crop to each face")
                  )}
                  {settings.detectionMode==="body"&&(lang==="es"
                    ?(settings.adjustToTargetSize?"Mantiene el tamaño objetivo (del cuello para abajo)":"Ajusta el crop al cuerpo (del cuello para abajo)")
                    :(settings.adjustToTargetSize?"Maintains target size (neck down)":"Adjusts crop to body (neck down)")
                  )}
                </div>
              )}

              {/* Grid manual de 3x3 */}
              {settings.detectionMode==="manual"&&(()=>{
                const pts=[{ax:0,ay:0},{ax:0.5,ay:0},{ax:1,ay:0},{ax:0,ay:0.5},{ax:0.5,ay:0.5},{ax:1,ay:0.5},{ax:0,ay:1},{ax:0.5,ay:1},{ax:1,ay:1}];
                const fp=settings.focalPoint||{ax:0.5,ay:0.5};
                return (
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,marginBottom:10,padding:"8px",background:"#181818",borderRadius:6,border:"1px solid #2a2a2a"}}>
                    {pts.map(({ax,ay},i)=>{
                      const active=fp.ax===ax&&fp.ay===ay;
                      return (
                        <button key={i} onClick={()=>setSettings(s=>({...s,focalPoint:{ax,ay}}))}
                          style={{aspectRatio:"1",border:"1.5px solid "+(active?"#7c5cff":"#252525"),borderRadius:5,background:active?"rgba(124,92,255,0.18)":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .12s",padding:0}}>
                          <div style={{width:7,height:7,borderRadius:"50%",background:active?"#7c5cff":"#333",boxShadow:active?"0 0 0 2px rgba(124,92,255,0.35)":"none",transition:"all .12s"}}/>
                        </button>
                      );
                    })}
                  </div>
                );
              })()}
            </div>

            {/* TRANSFORMAR */}
            <div className="sec-block">
              <span className="sec-title">{lang==="es"?"TRANSFORMAR":"TRANSFORM"}</span>
              
              <label className="lbl">{lang==="es"?"Rotación":"Rotation"}</label>
              <div style={{display:"flex",gap:6,marginBottom:10}}>
                <button onClick={()=>rotateImages(270)} disabled={!files.length} title={lang==="es"?"Rotar 90° izquierda":"Rotate 90° left"}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:20,fontWeight:400,border:"1px solid #2e2e2e",borderRadius:5,padding:"8px",cursor:files.length?"pointer":"not-allowed",background:"transparent",color:files.length?"#aaa":"#555",textAlign:"center",transition:"all .15s"}}
                  onMouseEnter={e=>files.length&&(e.currentTarget.style.background="#252525")}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  ↶
                </button>
                <button onClick={()=>rotateImages(90)} disabled={!files.length} title={lang==="es"?"Rotar 90° derecha":"Rotate 90° right"}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:20,fontWeight:400,border:"1px solid #2e2e2e",borderRadius:5,padding:"8px",cursor:files.length?"pointer":"not-allowed",background:"transparent",color:files.length?"#aaa":"#555",textAlign:"center",transition:"all .15s"}}
                  onMouseEnter={e=>files.length&&(e.currentTarget.style.background="#252525")}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  ↷
                </button>
              </div>

              <label className="lbl">{lang==="es"?"Voltear":"Flip"}</label>
              <div style={{display:"flex",gap:6,marginBottom:6}}>
                <button onClick={()=>flipImages('horizontal')} disabled={!files.length} title={lang==="es"?"Volteo horizontal":"Flip horizontal"}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:18,fontWeight:400,border:"1px solid #2e2e2e",borderRadius:5,padding:"6px",cursor:files.length?"pointer":"not-allowed",background:"transparent",color:files.length?"#aaa":"#555",textAlign:"center",transition:"all .15s"}}
                  onMouseEnter={e=>files.length&&(e.currentTarget.style.background="#252525")}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  ⇄
                </button>
                <button onClick={()=>flipImages('vertical')} disabled={!files.length} title={lang==="es"?"Volteo vertical":"Flip vertical"}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:18,fontWeight:400,border:"1px solid #2e2e2e",borderRadius:5,padding:"6px",cursor:files.length?"pointer":"not-allowed",background:"transparent",color:files.length?"#aaa":"#555",textAlign:"center",transition:"all .15s"}}
                  onMouseEnter={e=>files.length&&(e.currentTarget.style.background="#252525")}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  ⇅
                </button>
              </div>
            </div>

            {/* MARCO */}
            <div className="sec-block">
              <span className="sec-title">{t.secBorder}</span>
              <label className="lbl">{t.borderWidthLbl(settings.borderW)}</label>
              <input type="range" min={0} max={100} value={settings.borderW} onChange={e=>setSettings(s=>({...s,borderW:+e.target.value}))} style={{marginBottom:8}}/>
              {settings.borderW>0&&<>
                <label className="lbl">{t.borderColorLbl}</label>
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                  <input type="color" value={settings.borderColor} onChange={e=>setSettings(s=>({...s,borderColor:e.target.value}))}
                    style={{width:28,height:28,border:"1px solid #303030",borderRadius:4,padding:0,cursor:"pointer",background:"transparent"}}/>
                  <input type="text" value={settings.borderColor} onChange={e=>setSettings(s=>({...s,borderColor:e.target.value}))}
                    style={{flex:1,marginBottom:0,fontFamily:"monospace",fontSize:11}}/>
                </div>
              </>}
            </div>

            {/* ACCIONES */}
            <div className="sec-block">
              <span className="sec-title">{t.secActions}</span>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                <button onClick={clearAllCrops}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:11,fontWeight:500,border:"1px solid #2e2e2e",borderRadius:5,padding:"7px 10px",cursor:"pointer",background:"transparent",color:"#aaa",textAlign:"center"}}>
                  {t.clearAllCrops}
                </button>
                <button onClick={applyFocalAll}
                  style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:11,fontWeight:500,border:"1px solid #2e2e2e",borderRadius:5,padding:"7px 10px",cursor:"pointer",background:"transparent",color:"#aaa",textAlign:"center"}}>
                  {t.applyToAll}
                </button>
              </div>
              
              {/* Botón Deseleccionar todas - solo visible si hay selección */}
              {(selId || multiSel.size>0)&&(
                <button onClick={()=>{setSelId(null);setMultiSel(new Set());}}
                  style={{width:"100%",fontFamily:"Inter,sans-serif",fontSize:11,fontWeight:500,border:"1px solid rgba(124,92,255,0.3)",borderRadius:5,padding:"7px 10px",cursor:"pointer",background:"rgba(124,92,255,0.08)",color:"#a78bfa",textAlign:"center",marginBottom:12,transition:"all .15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.background="rgba(124,92,255,0.15)";e.currentTarget.style.borderColor="rgba(124,92,255,0.5)";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="rgba(124,92,255,0.08)";e.currentTarget.style.borderColor="rgba(124,92,255,0.3)";}}>
                  {lang==="es"?"✕ Deseleccionar todas":"✕ Deselect all"}
                </button>
              )}
              
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"#202020",borderRadius:5,padding:"8px 10px",fontSize:10,color:"#666"}}>
                  <div style={{marginBottom:2}}>{t.totalLbl}</div>
                  <div style={{fontSize:16,fontWeight:600,color:"#888"}}>{files.length}</div>
                </div>
                <div style={{background:selId||multiSel.size>0?"rgba(124,92,255,0.12)":"#202020",borderRadius:5,padding:"8px 10px",fontSize:10,color:"#666",transition:"all .2s"}}>
                  <div style={{marginBottom:2}}>{lang==="es"?"Seleccionadas":"Selected"}</div>
                  <div style={{fontSize:16,fontWeight:600,color:selId||multiSel.size>0?"#a78bfa":"#888"}}>
                    {selId && multiSel.size===0 ? 1 : multiSel.size}
                  </div>
                </div>
                <div style={{background:"#202020",borderRadius:5,padding:"8px 10px",fontSize:10,color:"#666"}}>
                  <div style={{marginBottom:2}}>{t.withCropLbl}</div>
                  <div style={{fontSize:16,fontWeight:600,color:"#a78bfa"}}>{manualCrop}</div>
                </div>
                <div style={{background:"#202020",borderRadius:5,padding:"8px 10px",fontSize:10,color:"#666"}}>
                  <div style={{marginBottom:2}}>{t.noCropLbl}</div>
                  <div style={{fontSize:16,fontWeight:600,color:"#888"}}>{autoCrop}</div>
                </div>
              </div>
            </div>

          </>)}

                    {/* ─── EXPORT TAB ─── */}
          {panelTab==="export"&&(<>

            {/* FORMATO */}
            <div className="sec-block">
              <span className="sec-title">{t.secExport}</span>
              <label className="lbl">{lang==="es"?"Formato":"Format"}</label>
              <select value={settings.fmt} onChange={e=>setSettings(s=>({...s,fmt:e.target.value}))}>
                <option value="jpeg">JPG</option>
                <option value="png">PNG</option>
                <option value="webp">WebP</option>
                <option value="avif">AVIF</option>
              </select>
              {settings.fmt!=="png"&&<>
                <label className="lbl">{t.qualityLbl?.(settings.quality)||`Calidad: ${settings.quality}%`}</label>
                <input type="range" min={1} max={100} value={settings.quality} onChange={e=>setSettings(s=>({...s,quality:+e.target.value}))} style={{marginBottom:6}}/>
              </>}
            </div>

            {/* MARCA DE AGUA */}
            <div className="sec-block">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <span className="sec-title" style={{marginBottom:0,marginTop:0,borderBottom:"none",paddingBottom:0}}>
                  {lang==="es"?"Marca de agua":"Watermark"}
                </span>
                <button onClick={()=>setSettings(s=>({...s,wmEnabled:!s.wmEnabled}))}
                  style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"3px 10px",cursor:"pointer",transition:"all .12s",
                    background:settings.wmEnabled?"#7c5cff":"transparent",
                    borderColor:settings.wmEnabled?"#7c5cff":"#2e2e2e",
                    color:settings.wmEnabled?"#fff":"#555"}}>
                  {settings.wmEnabled?"ON":"OFF"}
                </button>
              </div>
              <div style={{height:1,background:"#2a2a2a",marginBottom:10}}/>

              {settings.wmEnabled&&<>
                {/* Tipo: Texto / Imagen */}
                <label className="lbl">{lang==="es"?"Tipo":"Type"}</label>
                <div style={{display:"flex",gap:4,marginBottom:10}}>
                  {["texto","imagen"].map(m=>(
                    <button key={m} onClick={()=>setSettings(s=>({...s,wmType:m}))}
                      style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"6px 0",cursor:"pointer",transition:"all .12s",
                        background:(settings.wmType||"texto")===m?"#7c5cff":"transparent",
                        borderColor:(settings.wmType||"texto")===m?"#7c5cff":"#2e2e2e",
                        color:(settings.wmType||"texto")===m?"#fff":"#555"}}>
                      {m==="texto"?(lang==="es"?"Texto":"Text"):(lang==="es"?"Imagen":"Image")}
                    </button>
                  ))}
                </div>

                <label className="lbl">{lang==="es"?"Texto":"Text"}</label>
                <input type="text" placeholder="WATERMARK" value={settings.wmText||""} onChange={e=>setSettings(s=>({...s,wmText:e.target.value}))}/>

                <label className="lbl">{lang==="es"?"Fuente":"Font"}</label>
                <select value={settings.wmFont} onChange={e=>setSettings(s=>({...s,wmFont:e.target.value}))}>
                  <option value="Inter">Inter</option>
                  <option value="Arial">Arial</option>
                  <option value="Georgia">Georgia</option>
                  <option value="Times New Roman">Times New Roman</option>
                  <option value="Courier New">Courier New</option>
                </select>

                <label className="lbl">{lang==="es"?`Tamaño ${settings.wmSize}px`:`Size ${settings.wmSize}px`}</label>
                <input type="range" min={8} max={200} value={settings.wmSize} onChange={e=>setSettings(s=>({...s,wmSize:+e.target.value}))} style={{marginBottom:8}}/>

                <label className="lbl">{lang==="es"?"Color":"Color"}</label>
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                  <input type="color" value={settings.wmColor} onChange={e=>setSettings(s=>({...s,wmColor:e.target.value}))}
                    style={{width:28,height:28,border:"1px solid #303030",borderRadius:4,padding:0,cursor:"pointer",background:"transparent"}}/>
                  <input type="text" value={settings.wmColor} onChange={e=>setSettings(s=>({...s,wmColor:e.target.value}))}
                    style={{flex:1,marginBottom:0,fontFamily:"monospace",fontSize:11}}/>
                </div>

                <label className="lbl">{lang==="es"?`Opacidad ${settings.wmOpacity}%`:`Opacity ${settings.wmOpacity}%`}</label>
                <input type="range" min={5} max={100} value={settings.wmOpacity} onChange={e=>setSettings(s=>({...s,wmOpacity:+e.target.value}))} style={{marginBottom:8}}/>

                <label className="lbl">{lang==="es"?"Posición":"Position"}</label>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:3,marginBottom:6}}>
                  {[
                    {k:"tl",l:lang==="es"?"Sup. Izq":"Top Left"},
                    {k:"center-top",l:""},
                    {k:"tr",l:lang==="es"?"Sup. Der":"Top Right"},
                    {k:"bl",l:lang==="es"?"Inf. Izq":"Bot Left"},
                    {k:"center",l:lang==="es"?"Centro":"Center"},
                    {k:"br",l:lang==="es"?"Inf. Der":"Bot Right"}
                  ].map(({k,l},i)=>(
                    i===1?<div key="spacer" />:
                    <button key={k} onClick={()=>setSettings(s=>({...s,wmPos:k}))}
                      style={{fontFamily:"Inter,sans-serif",fontSize:9,fontWeight:settings.wmPos===k?600:400,border:"1px solid",borderRadius:4,padding:"5px 2px",cursor:"pointer",transition:"all .12s",
                        background:settings.wmPos===k?"#7c5cff":"transparent",
                        borderColor:settings.wmPos===k?"#7c5cff":"#2a2a2a",
                        color:settings.wmPos===k?"#fff":"#555"}}>
                      {l}
                    </button>
                  ))}
                </div>
              </>}
            </div>

            {/* NOMBRE DE ARCHIVO */}
            <div className="sec-block">
              <span className="sec-title">{lang==="es"?"Nombre de archivo":"Filename"}</span>
              <div style={{display:"flex",gap:4,marginBottom:10}}>
                {["keep","custom"].map(m=>(
                  <button key={m} onClick={()=>setSettings(s=>({...s,renameMode:m}))}
                    style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"6px 0",cursor:"pointer",transition:"all .12s",
                      background:settings.renameMode===m?"#7c5cff":"transparent",
                      borderColor:settings.renameMode===m?"#7c5cff":"#2e2e2e",
                      color:settings.renameMode===m?"#fff":"#555"}}>
                    {m==="keep"?(lang==="es"?"Mantener":"Keep"):(lang==="es"?"Personalizar":"Custom")}
                  </button>
                ))}
              </div>

              {settings.renameMode==="keep"&&<>
                <label className="lbl">{lang==="es"?"Prefijo":"Prefix"}</label>
                <input type="text" placeholder="instagram_" value={settings.prefix||""} onChange={e=>setSettings(s=>({...s,prefix:e.target.value}))}/>
                <label className="lbl">{lang==="es"?"Sufijo":"Suffix"}</label>
                <input type="text" placeholder="_final" value={settings.suffix||""} onChange={e=>setSettings(s=>({...s,suffix:e.target.value}))}/>
              </>}

              {settings.renameMode==="custom"&&<>
                <label className="lbl">{lang==="es"?"Nombre base":"Base name"}</label>
                <input type="text" placeholder="image" value={settings.renameBase||"image"} onChange={e=>setSettings(s=>({...s,renameBase:e.target.value||"image"}))}/>
                <div style={{fontSize:9,color:"#444",marginTop:-4,marginBottom:8,padding:"0 2px"}}>
                  {lang==="es"?"Usa ORIGINAL-NAME para insertar el nombre original":"Use ORIGINAL-NAME to insert original filename"}
                </div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                  <label className="lbl" style={{marginBottom:0}}>{lang==="es"?"Numeración":"Numbering"}</label>
                  <button onClick={()=>setSettings(s=>({...s,renameNum:!s.renameNum}))}
                    style={{fontFamily:"Inter,sans-serif",fontSize:10,fontWeight:600,border:"1px solid",borderRadius:4,padding:"3px 8px",cursor:"pointer",transition:"all .12s",
                      background:settings.renameNum?"#7c5cff":"transparent",
                      borderColor:settings.renameNum?"#7c5cff":"#2e2e2e",
                      color:settings.renameNum?"#fff":"#555"}}>
                    {settings.renameNum?"ON":"OFF"}
                  </button>
                </div>
                {settings.renameNum&&<>
                  <label className="lbl">{lang==="es"?"Empezar en":"Start at"}</label>
                  <input type="number" min={0} value={settings.renameStart||1} onChange={e=>setSettings(s=>({...s,renameStart:Math.max(0,+e.target.value)}))}/>
                </>}
              </>}
            </div>

            {/* DESCARGAR */}
            <div className="sec-block">
              <span className="sec-title">{lang==="es"?"Descargar":"Download"}</span>
              <div style={{display:"flex",gap:8}}>
                <div style={{flex:1}}>{mBtn(t.saveCurrent,exportCurrent,!sel,PURPLE)}</div>
                <div style={{flex:1}}>{mBtn(zipping?`${t.zipGenerating} ${zipPct}%`:t.zipBtn(files.length),exportZip,!files.length||zipping,"#4f46e5")}</div>
              </div>
              {zipping&&<div style={{marginTop:8,height:4,background:"#2a2a2a",borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",background:"#7c5cff",width:zipPct+"%",transition:"width .2s",borderRadius:2}}/>
              </div>}
            </div>
          </>)}

                  </aside>
        )}
      </div>

      {/* Edit overlay */}
      {editFile&&(
        <EditOverlay file={editFile} settings={settings} blurCfg={blurCfg} t={t}
          onClose={()=>setEditId(null)} onCropChange={setCropForId} onUndoPush={pushUndo} panelOpen={panelOpen} onBlurCfgChange={setBlurCfg}/>
      )}

      {/* Preview modal */}
      {previewFile&&(
        <PreviewModal file={previewFile} settings={settings} t={t} onClose={()=>setPreviewId(null)}/>
      )}

      {/* ML Warning Dialog */}
      {mlWarningDialog.show&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10000}}
             onClick={(e)=>{if(e.target===e.currentTarget) setMlWarningDialog({show:false,mode:null});}}>
          <div style={{background:"#1e1e1e",borderRadius:8,padding:"24px",maxWidth:480,width:"90%",border:"1px solid #2e2e2e",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}
               onClick={(e)=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:16}}>
              <span style={{fontSize:32}}>⚠️</span>
              <div style={{flex:1}}>
                <div style={{fontSize:16,fontWeight:600,color:"#e9c46a",marginBottom:8}}>
                  {lang==="es"?"Detección con Inteligencia Artificial":"AI Detection"}
                </div>
                <div style={{fontSize:13,color:"#b0b0b0",lineHeight:1.6}}>
                  {lang==="es"
                    ?"Esta función utiliza modelos de IA que pueden ralentizar el procesamiento, especialmente en equipos modestos o navegadores antiguos. El rendimiento puede variar según tu dispositivo."
                    :"This feature uses AI models that may slow down processing, especially on modest hardware or older browsers. Performance may vary depending on your device."}
                </div>
              </div>
            </div>
            
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,padding:"10px 12px",background:"#181818",borderRadius:5,border:"1px solid #2a2a2a"}}>
              <input type="checkbox" id="ml-dont-warn" checked={mlDontShowAgain} onChange={(e)=>{
                setMlDontShowAgain(e.target.checked);
                try{ localStorage.setItem("zirme-ml-dont-warn",e.target.checked?"true":"false"); }catch(err){}
              }} style={{width:16,height:16,cursor:"pointer"}}/>
              <label htmlFor="ml-dont-warn" style={{fontSize:12,color:"#888",cursor:"pointer",userSelect:"none"}}>
                {lang==="es"?"No volver a mostrar este aviso":"Don't show this warning again"}
              </label>
            </div>
            
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setMlWarningDialog({show:false,mode:null})}
                style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:500,border:"1px solid #2e2e2e",borderRadius:5,padding:"10px",cursor:"pointer",background:"transparent",color:"#aaa"}}>
                {lang==="es"?"Cancelar":"Cancel"}
              </button>
              <button onClick={()=>{
                setMlWarningDialog({show:false,mode:null});
                setSettings(s=>({...s,detectionMode:mlWarningDialog.mode,focalAuto:true}));
                setTimeout(()=>applyFocalAll(),100);
              }}
                style={{flex:1,fontFamily:"Inter,sans-serif",fontSize:12,fontWeight:600,border:"none",borderRadius:5,padding:"10px",cursor:"pointer",background:"#7c5cff",color:"#fff"}}>
                {lang==="es"?"Continuar":"Continue"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ZIRME />);
</script>
</body>
</html>
